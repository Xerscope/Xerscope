dependencies = [
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "pandas" },
    { name = "plotly" },
    { name = "pyarrow" },
    { name = "streamlit" },
]

[package.optional-dependencies]
crosscheck = [
    { name = "jpype1" },
    { name = "mpxj" },
]

[package.dev-dependencies]
dev = [
    { name = "complexipy" },
    { name = "deptry" },
    { name = "import-linter" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "radon" },
]

[package.metadata]
requires-dist = [
    { name = "jpype1", marker = "extra == 'crosscheck'", specifier = ">=1.7.1" },
    { name = "mpxj", marker = "extra == 'crosscheck'", specifier = ">=16.10.0" },
    { name = "numpy", specifier = ">=2.4" },
    { name = "pandas", specifier = ">=3.1.0" },
    { name = "plotly", specifier = ">=7.1.0" },
    { name = "pyarrow", specifier = ">=26.0.0" },
    { name = "streamlit", specifier = ">=1.66.1" },
]
provides-extras = ["crosscheck"]

[package.metadata.requires-dev]
dev = [
    { name = "complexipy", specifier = "==8.3.0" },
    { name = "deptry", specifier = "==0.25.1" },
    { name = "import-linter", specifier = "==2.16" },
    { name = "mypy", specifier = "==2.4.1" },
    { name = "pytest", specifier = ">=9.2.0" },
    { name = "radon", specifier = "==6.0.1" },
]
