# Sentences the keyword grammar was tuned on (analysis/query.py), with the filters a planner
# means, on the demo series (`xerscope sample`). Names, not ids: a WBS by its code, a resource
# by its short name, a code value as "Type:Value"; `clauses` lists what no facet says, in
# query.canonical form ("late", "!float:Critical"). Fields left out expect no filter.
# `xerscope ask-bench <folder> --cases tests/ask/dev.toml` prints the ratios; heldout.toml holds
# the sentences written blind, never used to tune.

[[case]]
text = "critical not started in civil works"
wbs = "CIV"
status = ["Not started"]
float = ["Critical"]

[[case]]
text = "critiques non démarrées CIV"
wbs = "CIV"
status = ["Not started"]
float = ["Critical"]

[[case]]
text = "quasi critique en cours"
status = ["In progress"]
float = ["Near critical"]

[[case]]
text = "ingénierie terminée"
wbs = "ENG"
status = ["Complete"]

[[case]]
text = "en retard mechanical"   # "mechanical" names the node and activities: the node, and a search in it
wbs = "MEC"
clauses = ["late"]   # late = total float < 0 (Oracle 47223), not Critical
search = "mechanical"

[[case]]
text = "earthworks"    # an own word of Civil works: the node and a search in it
wbs = "CIV"
search = "earthworks"

[[case]]
text = "show me the earthworks in CIV"
wbs = "CIV"
search = "earthworks"

[[case]]
text = "site crew in progress"
status = ["In progress"]
resources = ["CREW"]

[[case]]
text = "jalons en retard"
milestones = true
clauses = ["late"]

[[case]]
text = "hamacs vendor"
loe = true
resources = ["VENDOR"]

[[case]]
text = "critiques non démarrés en génie civil"
wbs = "CIV"
status = ["Not started"]
float = ["Critical"]

[[case]]
text = "milestones"
milestones = true

[[case]]
text = "commissioning not started"
wbs = "COM"
status = ["Not started"]

[[case]]
text = "procurement en cours"
wbs = "PRC"
status = ["In progress"]

[[case]]
text = "tout ce qui est terminé"
status = ["Complete"]

[[case]]
text = "design"        # an own word of Ingénierie: the node and a search in it
wbs = "ENG"
search = "design"

[[case]]
text = "vendor"
resources = ["VENDOR"]

[[case]]
text = "level of effort"
loe = true

[[case]]
text = "near critical commissioning"
wbs = "COM"
float = ["Near critical"]

[[case]]
text = "project management critical"
wbs = "PM"
float = ["Critical"]

# trade vocabulary in the other language than the file's (query._SYNONYMS)

[[case]]
text = "activités critiques de la mécanique"
wbs = "MEC"
float = ["Critical"]

[[case]]
text = "mise en service non commencée"
wbs = "COM"
status = ["Not started"]

[[case]]
text = "ce qui bloque la fin du lot électricité"   # "bloque" has no P6 meaning: named, not read as Critical
wbs = "MEC"

[[case]]
text = "fondations"    # a synonym of an own word of Civil works
wbs = "CIV"
search = "foundations"

[[case]]
text = "achats en retard"
wbs = "PRC"
clauses = ["late"]

[[case]]
text = "fournisseur en cours"
status = ["In progress"]
resources = ["VENDOR"]

[[case]]
text = "tuyauterie et instrumentation"   # own words of Mechanical & electrical
wbs = "MEC"
search = "piping instrumentation"

[[case]]
text = "études terminées"
wbs = "ENG"
status = ["Complete"]

# typos and near words: fuzzy matching (query.FUZZY), answered at a lower confidence

[[case]]
text = "mecanque critque"
wbs = "MEC"
float = ["Critical"]

[[case]]
text = "fondation"
wbs = "CIV"
search = "foundations"

[[case]]
text = "comissioning not strated"
wbs = "COM"
status = ["Not started"]

[[case]]
text = "vendeur en cours"
status = ["In progress"]
resources = ["VENDOR"]
