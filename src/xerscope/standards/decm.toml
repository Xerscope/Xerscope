# DCMA EVMS Compliance Metrics (DECM) — Guideline 6 (schedule), EVMS Test Metric
# Specification v8.0 (21 Aug 2025), the version DCMA applies from FY2026.
#
# Only the automated tests an XER can answer. Not here: 06A301a (vertical traceability:
# needs the parent/child baseline of a summary schedule), 06I101b and 06I201a (schedule
# margin and schedule visibility tasks: need your coding convention for them).
# 06A211a samples high-float activities for a documented rationale: xerscope lists them
# (target "info"); the rationale review is yours.
#
# DECM vocabulary -> P6: status date = data date (IPMR DID DI-MGMT-81861 §3.7.1.3.5.13: "The
# progress line is the date on which the schedule is statused, also known as "time-now," "data
# date," or "status date.""; 06A506c assumption 2 uses the IMS status date, not the period end);
# incomplete = no actual finish; summary task = WBS summary activity; hard constraints
# (Primavera) = Mandatory Start / Mandatory Finish. Each sheet's comparator is applied to the data
# date as written: 06A506a "after" is > data date, 06A506b "on or before" is <= data date.
# Each metric's source cites the specification sheet.

[standard]
id = "DECM"
name = "DCMA DECM v8.0 (schedule)"
description = "DCMA EVMS Compliance Metrics v8.0, Guideline 6 schedule tests"
source = "https://ssitools.com/helpandsuport/DECM/help/ssi_decm_schedule_tests.htm"

[[metric]]
id = "06A204b"
group = "Logic"
name = "Dangling logic"
description = "Incomplete non-LOE tasks and milestones with an open start or finish"
rule = "decm_06a204b_dangling_logic"
target = "<= 0%"
source = "06A204b: open start = only FF/SF or no predecessor (milestone: none); open finish = only SS/SF or no successor (milestone: none); earliest baseline start / latest baseline finish exempt, read in the whole IMS, LOE and finished activities included, ties sharing it (block 9: \"earliest baseline start date in the IMS\")"

[[metric]]
id = "06A205a"
group = "Logic"
name = "Lags"
description = "Incomplete tasks and milestones with at least one lag in their predecessor logic"
rule = "decm_06a205a_lags"
target = "<= 10%"
source = "06A205a: X/Y <= 10%; the sheet does not say whether LOE count or whether leads (negative lags) do: LOE kept, positive lags only"

[[metric]]
id = "06A208a"
group = "Logic"
name = "Summary tasks with logic"
description = "WBS summary tasks with a predecessor or successor"
rule = "decm_06a208a_summary_logic"
unit = "count"
target = "<= 0"
source = "06A208a: X = 0"

[[metric]]
id = "06A209a"
group = "Constraints and float"
name = "Hard constraints"
description = "Incomplete tasks and milestones with a hard constraint (Mandatory Start / Finish)"
rule = "decm_06a209a_hard_constraints"
target = "<= 0%"
source = "06A209a: X/Y = 0%; Primavera P6 hard constraints = Mandatory Start, Mandatory Finish; the sheet does not say whether LOE count: kept"

[[metric]]
id = "06A210a"
group = "Logic"
name = "LOE with discrete successors"
description = "Incomplete LOE tasks driving a discrete (non-LOE) task"
rule = "decm_06a210a_loe_successors"
target = "<= 0%"
source = "06A210a: X = 0"

[[metric]]
id = "06A211a"
group = "Constraints and float"
name = "High total float"
description = "Incomplete non-LOE tasks and milestones with total float > 44 working days (to sample for rationale)"
rule = "decm_06a211a_high_float"
params = { limit_days = 44 }  # working days of the activity's calendar
target = "info"
source = "06A211a: the population DECM samples; X/Y <= 20% of the sample with inadequate rationale"

[[metric]]
id = "06A212a"
group = "Logic"
name = "Out of sequence"
description = "Relationships whose successor started or finishes before the logic allows"
rule = "decm_06a212a_out_of_sequence"
unit = "count"
target = "<= 0"
source = "06A212a v8.0 (8/21/2025): block 6 \"X = Count of out of sequence conditions\", block 7 \"X = 0\" (a count, not the X/Y <= 1% of the SSI index page); LOE predecessors kept, the sheet does not set them apart (UNRESOLVED, also counted by 06A210a); FS (S.AS|S.FS) < P.FF, SS (S.AS|S.FS) < P.FS, FF (S.AF|S.FF) < P.FF, SF (S.AF|S.FF) < P.FS"

[[metric]]
id = "06A401a"
group = "Critical path"
name = "Critical path test"
description = "A delay on the critical path reaches the project finish"
rule = "decm_06a401a_critical_path_test"
params = { slip_days = 600 }  # working days added to the first open critical activity
target = "pass"
source = "06A401a: the schedule's critical path is the longest path. The DECM v8.0 sheet tests it with a constraint (finish no later than six months before the baseline finish) and compares the critical sets; it gives no slip length. xerscope runs the slip test of DCMA-12 instead (600 working days, xerscope's choice), read as DCMA-12 reads it: an approximation of 06A401a, not its method"

[[metric]]
id = "06A501a"
group = "Baseline, forecast and actual dates"
name = "Missing baseline dates"
description = "Tasks and milestones without a baseline start or finish"
rule = "decm_06a501a_missing_baseline"
target = "<= 5%"
source = "06A501a: X/Y <= 5%, summaries excluded"

[[metric]]
id = "06A504a"
group = "Baseline, forecast and actual dates"
name = "Actual starts changed"
description = "Actual start different from the previous update's"
rule = "decm_06a504a_actual_starts_changed"
params = { status_period_days = 28 }  # calendar days between the two updates compared
target = "<= 10%"
source = "06A504a: X/Y <= 10%, Y = tasks with an actual start; compared with the update one status period (28 days) earlier"

[[metric]]
id = "06A504b"
group = "Baseline, forecast and actual dates"
name = "Actual finishes changed"
description = "Actual finish different from the previous update's"
rule = "decm_06a504b_actual_finishes_changed"
params = { status_period_days = 28 }  # calendar days between the two updates compared
target = "<= 10%"
source = "06A504b: X/Y <= 10%, Y = tasks with an actual finish; compared with the update one status period (28 days) earlier"

[[metric]]
id = "06A505a"
group = "Baseline, forecast and actual dates"
name = "In progress without actual start"
description = "Progress reported (% complete > 0) but no actual start"
rule = "decm_06a505a_in_progress_without_actual_start"
target = "<= 5%"
source = "06A505a: X/Y <= 5%"

[[metric]]
id = "06A505b"
group = "Baseline, forecast and actual dates"
name = "Complete without actual finish"
description = "100 % complete but no actual finish"
rule = "decm_06a505b_complete_without_actual_finish"
target = "<= 5%"
source = "06A505b: X/Y <= 5%"

[[metric]]
id = "06A506a"
group = "Baseline, forecast and actual dates"
name = "Actual dates after the status date"
description = "Actual start or finish after the status date"
rule = "decm_06a506a_actual_dates_after_status_date"
target = "<= 5%"
source = "06A506a: X/Y <= 5%, Y = tasks with an actual start"

[[metric]]
id = "06A506b"
group = "Baseline, forecast and actual dates"
name = "Forecast dates before the status date"
description = "Incomplete tasks with a forecast start or finish before the status date"
rule = "decm_06a506b_forecast_dates_before_status_date"
unit = "count"
target = "<= 0"
source = "06A506b v8.0: X = 0, forecast start (not started) or forecast finish on or before the status date = data date (block 6; \"v8.0 Updated to include on or before status date 5, 6, 10\"). UNRESOLVED: block 10 step 3 keeps \"before\" for the finish, and 06A506c reads invalid as \"< Status Date\""

[[metric]]
id = "06A506c"
group = "Baseline, forecast and actual dates"
name = "Riding the status date"
description = "Forecasts that moved with the status date over two monthly updates"
rule = "decm_06a506c_riding_status_date"
params = { status_period_days = 28, riding_window_wd = 3, remaining_tolerance_wd = 2 }  # calendar days; working days; working days
target = "<= 1%"
source = "06A506c v8.0: X/Y <= 1%; start within 3 wd of the status date in both updates (the sheet's \"(5 calendar days)\" restates the 3 working days), or remaining duration within +/- 2 wd (block 10, step 4). UNRESOLVED: Y here leaves out LOE and the tasks absent from the earlier update; block 6 counts every incomplete task and milestone"
