version: 2
updates:
  - package-ecosystem: uv          # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker           # FROM lines in Dockerfile
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose   # image: lines (tailscale) in the Funnel stack
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker           # the two caddy tags of the Funnel stack's Caddy image; the
    directory: /deploy/caddy            # caddy-ratelimit version in its RUN line is bumped by hand
    schedule:
      interval: weekly
    groups:
      caddy:
        patterns: ["caddy"]             # builder and runtime move together: one Caddy release
  - package-ecosystem: docker           # the Trivy image the CI scans with (.github/trivy/Dockerfile)
    directory: /.github/trivy
    schedule:
      interval: daily
    cooldown:
      default-days: 7                   # a release waits a week: Trivy's compromised March 2026 releases
                                        # were withdrawn within hours (GHSA-69fq-xp46-6x23)
