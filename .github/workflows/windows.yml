name: windows

# The Files window in a browser (scripts/windows_check.py): what the window shows is what the server
# counts. It ticks files, closes the window with Esc on a page the app stopped, reopens it, and
# checks that the counter equals the boxes ticked in the page and that Done does not unload the series.
#
# On a pull request that touches the app: the state a widget keeps in the browser is invisible to
# AppTest (it has no browser), so a regression of the window shows nowhere else. A separate workflow:
# it installs a browser, and every job of tests.yml gates the publish, this one must not.
on:
  pull_request:
    paths:
      - "src/xerscope/app/**"
      - "scripts/windows_check.py"
      - "scripts/accessibility.py"
      - ".github/workflows/windows.yml"
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

# One run per ref at a time; a newer one waits for the run under way and replaces the one waiting.
concurrency:
  group: windows-${{ github.ref }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      - run: uv sync --locked --group accessibility
      # the Chromium build of the playwright version in uv.lock, with the system libraries it needs
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/windows_check.py
