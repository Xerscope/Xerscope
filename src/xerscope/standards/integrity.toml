# Integrity: is the file what P6 would calculate from its own logic?
# Not a published standard: checks that make the other standards trustworthy.

[standard]
id = "INTEGRITY"
name = "Integrity"
description = "Stored dates reproduce a recalculation; progress respects logic"
source = "xerscope: analysis/cpm.py, validated against P6-scheduled exports"

[[metric]]
id = "INT-01"
name = "Schedule recalculated"
description = "Open activities whose stored dates or total float differ from a recalculation. Mirrors the log's Scheduling Results (Latest Early Finish Date): the note gives it stored and recalculated, and the activities with external dates"
rule = "int_01_recalculated"
target = "<= 0%"
source = "Oracle P6 EPPM 26 help, Schedule Project Log, Scheduling Results: \"Latest Early Finish Date\" (https://docs.oracle.com/cd/G48897_01/p6help/en/99351.htm); Exceptions: \"Activities with external dates\" (https://docs.oracle.com/cd/G48897_01/p6help/en/99352.htm)"

[[metric]]
id = "INT-02"
name = "Out-of-sequence progress"
description = "Started before an FS predecessor finished or an SS predecessor started"
rule = "int_02_out_of_sequence_progress"
target = "info"

[[metric]]
id = "INT-03"
name = "Assignments recalculated"
description = "Open resource assignments whose stored remaining early/late dates differ from a recalculation"
rule = "int_03_assignments_recalculated"
target = "<= 0%"
