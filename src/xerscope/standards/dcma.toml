# DCMA 14-Point Schedule Assessment, as DCMA-EA PAM 200.1 (Oct 2012) defines it: section 4
# (the 14 points, 4.0 for the populations) plus 3.1.2.3 (CPLI) and 3.1.2.4 (BEI). Each metric's
# `source` cites its section.
#
# Legacy: DCMA itself now assesses schedules with the DECM (decm.toml, v8.0). The 14-Point
# remains the industry's common screen.
#
# Population: incomplete activities, excluding LOE and milestones (PAM 200.1 section 4.0; WBS
# summary always), except the checks that need finished work: missed tasks (11) and BEI (14).
# Relationships: those into incomplete, non-LOE, non-milestone work. Durations and float in working days.
# Inputs are weekly XERs: there is no detail planning period or rolling wave window (DCMA-08).
# xerlock's published result on its sample schedule is a comparison, not the authority; where
# the pamphlet differs from it (DCMA-01, 04, 05, 11, 13) the difference is noted in
# tests/reference/expected.py.

[standard]
id = "DCMA"
name = "DCMA 14-Point"
description = "DCMA 14-Point Schedule Assessment (legacy; DCMA now uses the DECM)"
source = "DCMA-EA PAM 200.1 (Oct 2012), section 4 and sections 3.1.2.3, 3.1.2.4"

[[metric]]
id = "DCMA-01"
name = "Logic"
description = "Incomplete tasks missing a predecessor or a successor"
rule = "dcma_01_logic"
target = "<= 5%"
source = "DCMA-EA PAM 200.1 §4.1: any incomplete task missing a predecessor and/or a successor; no project start/finish exemption and no dangling case; §4.0: milestones excluded; a link to another project counts as logic (has_external_pred / has_external_succ)"

[[metric]]
id = "DCMA-02"
name = "Leads"
description = "Relationships with a negative lag"
rule = "dcma_02_leads"
unit = "count"  # a 0 target reads the same in count and in %; the count is what the analyst acts on
target = "<= 0"
source = "DCMA-EA PAM 200.1 §4.2: logic links with a lead (negative lag) in predecessor relationships for incomplete tasks; a link whose predecessor is in another project of the file counts (as for DCMA-01), the pamphlet being silent; §4.0: completed, LOE, summary tasks and milestones are excluded, so a link counts when its successor is kept"

[[metric]]
id = "DCMA-03"
name = "Lags"
description = "Relationships with a positive lag"
rule = "dcma_03_lags"
target = "<= 5%"
source = "DCMA-EA PAM 200.1 §4.3: lags in predecessor logic relationships for incomplete tasks; a link whose predecessor is in another project of the file counts (as for DCMA-01), the pamphlet being silent; §4.0: completed, LOE, summary tasks and milestones are excluded, so a link counts when its successor is kept"

[[metric]]
id = "DCMA-04"
name = "Relationship types"
description = "Share of Finish-to-Start relationships"
rule = "dcma_04_relationship_types"
target = ">= 90%"
source = "DCMA-EA PAM 200.1 §4.4: a count of incomplete tasks containing each type of logic link; a link whose predecessor is in another project of the file counts (as for DCMA-01), the pamphlet being silent; §4.0: completed, LOE, summary tasks and milestones are excluded, so a link counts when its successor is kept"

[[metric]]
id = "DCMA-05"
name = "Hard constraints"
description = "Start/finish on, start/finish no later than, mandatory dates"
rule = "dcma_05_hard_constraints"
target = "<= 5%"
source = "DCMA-EA PAM 200.1 §4.5 (and §4.0: milestones excluded); MSO = Start On / Mandatory Start, MFO = Finish On / Mandatory Finish, SNLT = Start On or Before, FNLT = Finish On or Before"

[[metric]]
id = "DCMA-06"
name = "High float"
description = "Total float above 44 working days"
rule = "dcma_06_high_float"
params = { limit_days = 44 }  # working days of the activity's calendar
target = "<= 5%"
source = "DCMA-EA PAM 200.1 §4.6: incomplete task with total float greater than 44 working days (2 months); §4.0: milestones excluded. A task without a float stays in the population and cannot be flagged (the pamphlet is silent); the note counts them"

[[metric]]
id = "DCMA-07"
name = "Negative float"
description = "Total float below 0"
rule = "dcma_07_negative_float"
unit = "count"  # a 0 target reads the same in count and in %; the count is what the analyst acts on
target = "<= 0"
source = "DCMA-EA PAM 200.1 §4.7: incomplete task with total float less than 0 working days; §4.0: milestones excluded. A task without a float stays in the population and cannot be flagged (the pamphlet is silent); the note counts them"

[[metric]]
id = "DCMA-08"
name = "High duration"
description = "Baseline duration above 44 working days"
rule = "dcma_08_high_duration"
params = { limit_days = 44 }  # working days of the activity's calendar
target = "<= 5%"
source = "DCMA-EA PAM 200.1 §4.8: an incomplete task with a baseline duration greater than 44 working days (2 months) and a baseline start within the detail planning period or rolling wave; §4.0: LOE and milestones excluded. UNRESOLVED: inputs are weekly XERs with no detail planning window, so every baseline start qualifies. UNRESOLVED: baseline hours are divided by the activity's current hours per day, not the baseline calendar. An activity absent from the baseline is not flagged; without a baseline the check is n/a"

[[metric]]
id = "DCMA-09"
name = "Invalid dates"
description = "Forecast before the status date, or actual after it"
rule = "dcma_09_invalid_dates"
params = { date_grain = "day" }  # the pamphlet compares dates ("on or before 8/1/09"); P6 compares timestamps (p6.toml default)
unit = "count"  # a 0 target reads the same in count and in %; the count is what the analyst acts on
target = "<= 0"
source = "DCMA-EA PAM 200.1 §4.9: incomplete tasks with a forecast start/finish before the status date, or an actual start/finish beyond it, by calendar day (§4.9 reasons in dates: \"on or before 8/1/09, not after 8/1/09\"); §4.0: \"This analysis should exclude Completed tasks, LOE tasks, Subprojects (called Summary tasks in MS Project), and Milestones.\" A completed task with an actual finish after the status date is out (§4.9: \"Incomplete tasks ... are included in this metric.\"); 06A506a and P6-10b report it. UNRESOLVED: the intent of \"actual start/finish\" in §4.9"

[[metric]]
id = "DCMA-10"
name = "Resources"
description = "Tasks with a duration but no resource or cost"
rule = "dcma_10_resources"
target = "<= 0%"
source = "DCMA-EA PAM 200.1 §4.10: \"all tasks with durations greater than zero have dollars or hours assigned\", \"If the contractor does resource load their schedule\"; incomplete tasks without them over incomplete tasks; §4.0 exclusions apply. Cost or hours = a resource assignment or an expense. n/a when the project has no assignment and no budgeted labour hours. Threshold 0%: the PAM asks that all tasks with a duration carry dollars or hours and states no percentage; population as PAM"

[[metric]]
id = "DCMA-11"
name = "Missed tasks"
description = "Due by the status date (baseline finish) but finished, or forecast to finish, on a later date"
rule = "dcma_11_missed_tasks"
params = { date_grain = "day" }  # due = baseline finish on or before the status date, by calendar day as the pamphlet reads it
target = "<= 5%"
source = "DCMA-EA PAM 200.1 (Oct 2012) 4.11: baseline finish on or before the status date (by calendar day); missed when the actual or forecast finish is after it by calendar date OR the Finish Variance (working time on the task's calendar, as in MS Project and P6) is greater than zero, the pamphlet's two criteria joined by \"or\"; base excludes tasks missing a baseline start or finish. 4.0 excludes completed tasks, LOE, summary tasks and milestones; 4.11 measures actual finishes, so completed tasks stay here (4.11 overrides 4.0 on that point)"

[[metric]]
id = "DCMA-12"
name = "Critical path test"
description = "A delay on the critical path moves the finish by the same amount"
rule = "dcma_12_critical_path_test"
params = { slip_days = 600 }  # working days; xerscope's choice: PAM 200.1 §4.12 gives no length
target = "pass"
source = "DCMA-EA PAM 200.1 §4.12: a slip is introduced on a task of the critical path and the project completion date must move \"in direct proportion\" (the pamphlet's other criterion, a completion date showing negative total float, is the same test: with a Must Finish By the end's float falls by exactly the finish's shift, and a Mandatory Finish keeps it at 0 and fails both). Method (xerscope's choice, the pamphlet names only \"a task of the critical path\"): the first open task of the longest path has its remaining duration extended; the delayed task drops its expected finish. 600 working days is xerscope's choice: neither PAM 200.1 §4.12 nor DECM v8.0 06A401a gives a slip length"

[[metric]]
id = "DCMA-13"
name = "CPLI"
description = "Critical Path Length Index = (CPL + total float) / CPL"
rule = "dcma_13_cpli"
target = ">= 0.95"
source = "DCMA-EA PAM 200.1 §3.1.2.3: CPLI = (CPL + TF) / CPL, TF being the total float of the completion milestone (\"the amount of days a project can be delayed before delaying the project completion date\"). Days: PAM and Acumen name no calendar; the project calendar here, for CPL and TF. P6 writes that float against the Must Finish By date; without one, the open finish milestone ending last is the measured milestone: CPL runs to its forecast finish and TF is its margin to its baseline finish: the PAM measures TF \"relative to the baselined finish date, when constrained\" (§3.1.2.3); n/a without a baseline, and n/a when the finish driver has no float (a missing float is not 0). The PAM measures CPL to the next measured milestone, which the analyst chooses and documents; xerscope takes the open finish milestone ending last, or the last open task when a Must Finish By gives the float"

[[metric]]
id = "DCMA-14"
name = "BEI"
description = "Tasks completed / tasks due by the status date (baseline)"
rule = "dcma_14_bei"
params = { date_grain = "day" }  # a baseline finish on the status date is due (step 2) and an actual finish on it completed (step 5), by calendar day as 4.9 and 4.11
target = ">= 0.95"
source = "DCMA-EA PAM 200.1 §3.1.2.4: step 1 filters out LOE, summary and zero duration tasks (milestones), so a task with no original duration is out whatever its type (the funnel lists them); step 5 keeps only actual finishes up to the status date, so a task finished after it is due, not completed; tasks missing baseline finish dates are included in the denominator, read as tasks with no baseline finish (UNRESOLVED: the formula's \"Total # of Tasks Missing Baseline Finish Date\" could also mean tasks that missed it)"
