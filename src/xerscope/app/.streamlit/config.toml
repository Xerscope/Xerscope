[server]
headless = true
# Streamlit listens on every interface by default: anyone on the network could open your
# schedules. Keep it local; use `xerscope app --host 0.0.0.0` only on purpose.
address = "localhost"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 200  # MB, per file
# Serves app/static/ (the fonts below, nothing else) at app/static/: the fonts come from the
# app itself, no request leaves for a font host.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# viewer: the ⋮ menu keeps the visitor's options (theme System / Light / Dark, print) and hides
# the developer ones (rerun, clear cache, deploy). Charts take the new theme at the next rerun.
toolbarMode = "viewer"
# No CSV download or clipboard copy from the tables: they show the real schedule. Exports
# go through the app's own buttons (anonymised lists, Debug diagnostic, XER extract, Power BI).
disableDataExport = true

# Light and dark themes; Streamlit follows the browser and the user can switch in Settings.
# Cool neutrals, hairline borders, one glacier-cyan accent: linkColor, the same as ACCENT in
# viz/charts.py (#7DD3FC in dark mode, #0369A1 in light mode). primaryColor fills checkboxes,
# toggles and selected chips under white text, so it stays a deep cyan in both modes (>= 4.5:1
# under white, >= 3:1 on the page).
# Red, amber and green are reserved for status (fail / warning / pass) and never decorate.
# The chart and Gantt colours in viz/charts.py and viz/gantt.py must match these
# (tests/test_analysis_and_viz.py).
[theme]
# Variable fonts (weight axis in the file), latin subset, SIL OFL 1.1: app/static/OFL-*.txt.
# The same family is set on the Plotly charts (viz/charts.py) and the Gantt (viz/gantt.css).
font = "Inter Tight, sans-serif"
headingFont = "Inter Tight, sans-serif"
codeFont = "JetBrains Mono, monospace"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 15
headingFontSizes = ["1.9rem", "1.35rem", "1.12rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [500, 550, 550, 550, 550, 550]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 300
paddingTop = "2.5rem"

[theme.light]
primaryColor = "#0369A1"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#0B1220"
linkColor = "#0369A1"
borderColor = "#E3E8EF"
dataframeBorderColor = "#E3E8EF"
dataframeHeaderBackgroundColor = "#F5F7FA"
dataframeHeaderTextColor = "#3A4A5E"
redColor = "#C0392B"
greenColor = "#2E7D32"
orangeColor = "#A15C00"
blueColor = "#0369A1"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#0275B3"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0D1424"
textColor = "#E6EBF2"
linkColor = "#7DD3FC"
borderColor = "#182136"
dataframeBorderColor = "#182136"
dataframeHeaderBackgroundColor = "#0D1424"
dataframeHeaderTextColor = "#B4C0D0"
redColor = "#F05252"
greenColor = "#22C55E"
orangeColor = "#FAB219"
blueColor = "#7DD3FC"

[theme.dark.sidebar]
backgroundColor = "#090E1A"
secondaryBackgroundColor = "#0D1424"

[[theme.fontFaces]]
family = "Inter Tight"
url = "app/static/InterTight-latin-wght.woff2"
style = "normal"

[[theme.fontFaces]]
family = "Inter Tight"
url = "app/static/InterTight-latin-wght-italic.woff2"
style = "italic"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-latin-wght.woff2"
style = "normal"
