# Remote access through Tailscale Funnel + Caddy, for people who cannot install Tailscale
# (a corporate laptop on its own VPN): https://<hostname>.<tailnet>.ts.net from any browser,
# behind a username and password.
#
#   cp .env.example .env            # TS_AUTHKEY (tagged, ephemeral off), XERSCOPE_USER, XERSCOPE_PASSWORD_HASH
#   docker run --rm caddy:2.11.2 caddy hash-password --plaintext 'your password'   # -> the hash
#   docker compose -f compose.funnel.yaml up -d --build
#   docker compose -f compose.funnel.yaml exec tailscale tailscale funnel status
#
# Nothing touches the host network: tailscaled runs in userspace (no TUN device, no route,
# no DNS change), no port is published, the only outbound traffic is Tailscale's own.
# Funnel must be allowed for the node's tag in the tailnet ACL:
#   "nodeAttrs": [{ "target": ["tag:xerscope"], "attr": ["funnel"] }]
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: xerscope                              # https://xerscope.<tailnet>.ts.net
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:xerscope
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    networks: [egress, internal]                    # egress: outbound to Tailscale only (nothing published)
    restart: unless-stopped

  caddy:
    image: caddy:2.11.2
    network_mode: service:tailscale                 # listens on 127.0.0.1:8080 of that namespace only
    environment:
      XERSCOPE_USER: ${XERSCOPE_USER}
      XERSCOPE_PASSWORD_HASH: ${XERSCOPE_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [tailscale]
    restart: unless-stopped

  xerscope:
    build: .
    image: xerscope:latest
    environment:
      XERSCOPE_DATA: /data
      # Secret URL prefix (same idea as XERSCOPE_PATH on the remote image): set the SAME
      # value here and as the handler key in tailscale-serve.json ("/" -> "/<path>"), and
      # Funnel publishes only https://<host>.<tailnet>.ts.net/<path>; Tailscale answers 404
      # to everything else before it reaches these containers.
      # STREAMLIT_SERVER_BASE_URL_PATH: /REPLACE-WITH-24-RANDOM-CHARS
      # XERSCOPE_BASELINE: /data/BL.xer
    volumes:
      - ./exports:/data:ro                          # on a NAS: /volume1/plannings:/data:ro
    networks: [internal]                            # nothing published: reachable from Caddy only
    read_only: true
    tmpfs:
      - /tmp
      - /home/nonroot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  egress: {}                                      # ordinary bridge: tailscaled reaches the control plane
  internal:
    internal: true                                  # no gateway: xerscope cannot reach the internet
