name: tests

# Minutes are the scarce resource on a private repository (Windows counts double):
#   pull requests and main  -> Linux only, two Pythons (oldest and newest supported)
#   Monday run and manual   -> the full matrix, Windows included
# A new push to a pull request cancels the run still going for its previous one; on main every
# commit is tested to the end, then the publish job (image.yml) runs once every other job passed.
on:
  push:
    branches: [main]
    tags: ["v*"]          # a release tag is tested before the publish job publishes it
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # every Monday: catches newly published CVEs without a push

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# Actions are pinned to a commit SHA (a tag can be moved by whoever controls the repo);
# Dependabot (.github/dependabot.yml) proposes the updates. uv (setup-uv `version`, the same
# release as the Dockerfile's) and the tools run with uvx are pinned to one release, bumped by
# hand: Dependabot reads neither.
#
# XERSCOPE_REQUIRE names the evidence a job must have (tests/conftest.py `missing`): a test
# that would skip for want of it fails instead, so a job cannot go green by skipping the
# reference files, the P6 corpus or the MPXJ cross-check.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uvx ruff@0.17.4 check src tests scripts
      - run: uvx ruff@0.17.4 format --check src tests scripts
      - name: No schedule or data export is tracked (the repository is public)
        run: "! git ls-files | grep -iE '\\.(xer|parquet|xlsx?|csv)$'"

  oracle-report:
    # Witness, never a gate: how many tests compare with P6, MPXJ, a standard's text, a
    # property or the golden file (marker `oracle`, tests/conftest.py), and how many say nothing.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run python scripts/oracle_report.py | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    strategy:
      fail-fast: false
      matrix:
        # full matrix on the Monday run and by hand; Linux + oldest/newest Python otherwise
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11", "3.13", "3.14"]' || '["3.11", "3.14"]') }}
    runs-on: ${{ matrix.os }}
    env:
      XERSCOPE_REQUIRE: reference,p6-corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Reference data cache (keyed on the pinned commits and checksums)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/reference/data
          key: reference-${{ hashFiles('tests/reference/sources.py', 'tests/reference/fetch.py', 'tests/reference/fetch_p6_heldout.py') }}
      - name: Reference XERs (pinned, checksum-verified) and the P6-scheduled corpus (pinned commit)
        run: |
          uv run python tests/reference/fetch.py
          uv run python tests/reference/fetch_p6_heldout.py
      - name: Tests (parser, model, CPM against P6, checks, app pages)
        run: uv run pytest -rs
      - name: CLI smoke test
        run: |
          uv run xerscope sample --out data/sample
          uv run xerscope info data/sample
          uv run xerscope export data/sample --out export --format csv

  fitness:
    # Code fitness against tests/fitness_baseline.json (scripts/fitness.py), table in the job summary.
    # Measure only for now: continue-on-error goes once the baseline is validated, and the job
    # then fails on any measure worse than the baseline.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"  # the baseline's; radon 6.0.1 cannot tokenise xer/parser.py on 3.11
      - run: uv sync --locked
      - run: uv run python scripts/fitness.py --markdown "$GITHUB_STEP_SUMMARY" --check tests/fitness_baseline.json

  audit:
    # Known vulnerabilities in every locked dependency, extras and dev tools included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv export --locked --all-extras --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --no-deps -s osv
      - run: uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --no-deps -s pypi
      - run: uvx bandit@1.9.4 -r src -ll  # medium and high severity only

  crosscheck:
    # Independent reading with MPXJ (Java) on the reference files and the demo data, and the
    # CPM against MPXJ's scheduler (built from a pinned commit: the PyPI release predates #972).
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]  # both current LTS releases
    runs-on: windows-latest
    env:
      XERSCOPE_REQUIRE: reference,p6-corpus,mpxj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
      - run: uv sync --locked --extra crosscheck
      - name: Reference data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/reference/data
          key: reference-${{ hashFiles('tests/reference/sources.py', 'tests/reference/fetch.py', 'tests/reference/fetch_p6_heldout.py') }}
      - run: uv run python tests/reference/fetch.py
      - run: uv run python tests/reference/fetch_p6_heldout.py
      - run: uv run xerscope sample --out data/sample
      - run: uv run xerscope crosscheck tests/reference/data/mpxj tests/reference/data/xerlock data/sample
      - name: MPXJ's CPM scheduler, pinned commit, rebuilt so a restored jar never targets another Java
        run: uv run python tests/reference/mpxj_cpm.py --force
      - name: CPM against MPXJ (P6 exports, random networks, hand cases, demo)
        run: uv run pytest -rs tests/test_crosscheck_mpxj.py tests/test_reference.py

  changes:
    # Pull requests only: whether the change touches what the app image is built or scanned from.
    # The checkout of a pull request is its merge commit; its first parent is the base branch tip.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^(Dockerfile$|uv\.lock$|pyproject\.toml$|src/|\.github/trivy/)' changed.txt; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  container:
    # The image builds, answers on its health endpoint with the demo data mounted, and
    # Trivy scans it: on main, tags, the Monday run, by hand, and on a pull request that changes
    # the Dockerfile, the lock, pyproject.toml, src/ or the Trivy pin (the image build is the
    # most expensive job here). image.yml publishes a commit only once this job passed on it.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: xerscope:ci
          cache-from: type=gha,scope=xerscope
      - name: The app image starts, serves on 8501 and reads a mounted folder
        # distroless: no shell in the image; the demo set is written to a volume by the
        # image itself (its /data belongs to the runtime user)
        run: |
          docker volume create exports
          docker run --rm -v exports:/data xerscope:ci sample --out /data/sample
          docker run -d --name app -p 127.0.0.1:8501:8501 -v exports:/data:ro -e XERSCOPE_DATA=/data/sample xerscope:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok
          docker exec app /app/.venv/bin/xerscope info /data/sample | grep -q data_date
          docker logs app
          docker rm -f app
      - name: What the scanner cannot see, and the Debian fixes laid over the base
        # Listed on every run: the OS_FIXES of the Dockerfile with the version the image records,
        # and the libraries compiled into the managed CPython (Trivy reads dpkg records only).
        run: |
          {
            echo "### Debian fixes laid over the distroless base (Dockerfile OS_FIXES)"
            sed -n 's/^ARG OS_FIXES="\(.*\)"/\1/p' Dockerfile | tr ' ' '\n' | sed 's/^/- /'
            echo
            echo "### Version recorded in the image for each of them"
            docker create --name rec xerscope:ci >/dev/null
            for pkg in $(sed -n 's/^ARG OS_FIXES="\(.*\)"/\1/p' Dockerfile | tr ' ' '\n' | cut -d= -f1); do
              docker cp "rec:/var/lib/dpkg/status.d/$pkg" - | tar -xO | grep -E '^(Package|Version):' | paste -sd' ' | sed 's/^/- /'
            done
            docker rm rec >/dev/null
            echo
            echo "### Libraries compiled into the image's Python (not scanned by Trivy)"
            docker run --rm --entrypoint /app/.venv/bin/python xerscope:ci -c "import sys, sqlite3, pyexpat, ssl, zlib; print(f'- python {sys.version.split()[0]}'); print(f'- sqlite {sqlite3.sqlite_version}'); print(f'- {pyexpat.EXPAT_VERSION}'); print(f'- {ssl.OPENSSL_VERSION}'); print(f'- zlib {zlib.ZLIB_RUNTIME_VERSION}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Known vulnerabilities in the image (OS packages and Python wheels), fixed ones only
        run: .github/trivy/scan.sh xerscope:ci   # the Trivy pinned in .github/trivy/Dockerfile

  deploy:
    # deploy/ as the NAS runs it, without the app and without a tailnet login: the compose
    # file is valid, tailscaled starts on its read-only root and the CLI reaches it, Caddy
    # answers 404 outside the prefix, 401 inside it, 502 once authenticated (no app here),
    # the security headers on every answer, the prefix never appears in its log, and a
    # client over the rate limit gets 429. Caddy runs on deploy/caddy/Dockerfile built from
    # this commit, the image image.yml publishes once merged.
    runs-on: ubuntu-latest
    env:
      XERSCOPE_USER: ci
      XERSCOPE_PATH: ci0prefix0for0the0log0check
      XERSCOPE_EXPORTS: /tmp/exports
      XERSCOPE_CADDY_IMAGE: xerscope-caddy:ci
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The compose file is valid with the NAS's variables
        id: compose
        run: |
          mkdir -p "$XERSCOPE_EXPORTS"
          docker build -t "$XERSCOPE_CADDY_IMAGE" caddy   # fails if rate_limit is not compiled in
          caddy_image="$XERSCOPE_CADDY_IMAGE"
          hash=$(docker run --rm "$caddy_image" caddy hash-password --algorithm bcrypt --bcrypt-cost 10 --plaintext ci-pass)
          echo "XERSCOPE_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"
          XERSCOPE_PASSWORD_HASH="$hash" docker compose config --quiet
          docker run --rm -e XERSCOPE_USER -e XERSCOPE_PATH -e XERSCOPE_PASSWORD_HASH="$hash" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "caddy=$caddy_image" >> "$GITHUB_OUTPUT"
          echo "tailscale=$(sed -n 's/^    image: \(tailscale\/[^ ]*\).*/\1/p' compose.yaml)" >> "$GITHUB_OUTPUT"
      - name: tailscaled starts on a read-only root; the CLI finds it at its default socket
        run: |
          docker compose up -d tailscale caddy
          for i in $(seq 1 30); do
            docker compose exec -T tailscale tailscale status > status.txt 2>&1 || true
            grep -q -i -E "logged out|log in at|needslogin" status.txt && break
            sleep 2
          done
          cat status.txt
          grep -q -i -E "logged out|log in at|needslogin" status.txt
          docker compose logs tailscale > tailscale.log
          ! grep -i "read-only file system" tailscale.log
      - name: Caddy outside and inside the prefix
        run: |  # one check per line: bash -e does not stop on a failure inside an && list
          get() { docker compose exec -T caddy wget -S -q -O /dev/null "$1" 2>&1 || true; }
          out=$(get "http://127.0.0.1:8080/"); echo "$out"
          echo "$out" | grep -q " 404 "
          out=$(get "http://127.0.0.1:8080/$XERSCOPE_PATH/"); echo "$out"
          echo "$out" | grep -q " 401 "
          out=$(get "http://ci:ci-pass@127.0.0.1:8080/$XERSCOPE_PATH/"); echo "$out"
          echo "$out" | grep -q " 502 "
          docker compose logs --no-color caddy > caddy.log
          # busybox wget prints no header of an error answer: Caddy's access log records what it sent
          for code in 404 401; do
            line=$(grep "\"status\": $code," caddy.log | tail -n 1)
            echo "$line" | grep -q '"Referrer-Policy": \["no-referrer"\]'
            echo "$line" | grep -q '"X-Content-Type-Options": \["nosniff"\]'
            echo "$line" | grep -q "\"Content-Security-Policy\": \[\"frame-ancestors 'self'\"\]"
            echo "$line" | grep -q '"Strict-Transport-Security": \["max-age=31536000"\]'
            echo "$line" | grep -q '"Permissions-Policy": \["camera=(), microphone=(), geolocation=()"\]'
          done
          ! grep -q "$XERSCOPE_PATH" caddy.log
          grep -q '"uri": "/<prefix>/"' caddy.log   # the prefix is masked, the rest of the path kept
      - name: Rate limit, last (it blocks the runner's address for a minute)
        run: |  # 300 requests a minute per visitor, counted before the password check
          docker compose exec -T caddy sh -c '
            i=0; while [ $i -lt 310 ]; do
              wget -S -q -O /dev/null "http://127.0.0.1:8080/$XERSCOPE_PATH/" 2>&1 | grep -o "HTTP/1.1 [0-9]*"
              i=$((i+1))
            done' > codes.txt || true
          sort codes.txt | uniq -c
          grep -q "HTTP/1.1 401" codes.txt   # under the limit: the password prompt
          grep -q "HTTP/1.1 429" codes.txt   # over it: refused before any bcrypt run
          docker compose logs --no-color caddy > caddy.log
          grep '"status": 429,' caddy.log | tail -n 1 | grep -q '"Retry-After"'
      - name: Known vulnerabilities in the Caddy image, fixed ones only
        if: ${{ !cancelled() }}   # each image scanned even if the other fails
        working-directory: .
        env:
          IMAGE: ${{ steps.compose.outputs.caddy }}
        run: .github/trivy/scan.sh "$IMAGE"   # no exception file
      - name: No golang.org/x/net/html code in the Tailscale binaries (CVE-2026-78661 not reachable, recorded)
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ steps.compose.outputs.tailscale }}
        run: |  # Go keeps every function name in a binary, even stripped (-s -w): names of the image's own
          # code prove they are readable, and no name of the HTML parser may be there
          work=$(mktemp -d); cid=$(docker create "$IMAGE")
          for bin in containerboot tailscale tailscaled; do
            docker cp -q "$cid:/usr/local/bin/$bin" "$work/$bin"
            if ! grep -aq 'tailscale.com/' "$work/$bin"; then echo "$bin: function names unreadable"; exit 1; fi
            if grep -aq 'golang.org/x/net/html\.' "$work/$bin"; then echo "$bin: holds golang.org/x/net/html code"; exit 1; fi
            echo "$bin: no golang.org/x/net/html code"
          done
          docker rm -f "$cid" > /dev/null
      - name: Known vulnerabilities in the Tailscale image, fixed ones only
        if: ${{ !cancelled() }}   # each image scanned even if the other fails
        working-directory: .
        env:
          IMAGE: ${{ steps.compose.outputs.tailscale }}
        run: .github/trivy/scan.sh "$IMAGE"   # no exception file
      - name: Container states and logs, when a step failed
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  publish:
    # the images of this commit (image.yml), on a push of main or of a v* tag only, once every
    # job above passed: a red job, a skipped one or a pull request publishes nothing
    needs: [lint, oracle-report, test, fitness, audit, crosscheck, container, deploy]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write                             # push the images and the attestation to ghcr.io
      id-token: write                             # OIDC token behind the provenance attestation (Sigstore)
      attestations: write                         # store it with the repository's attestations
    uses: ./.github/workflows/image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
