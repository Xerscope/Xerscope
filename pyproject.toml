[project]
name = "xerscope"
version = "0.1.0"
description = "Weekly Primavera P6 XER schedule analysis and visualisation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quentin Gouttaya", email = "beatsgr3y@gmail.com" }]
keywords = ["primavera", "p6", "xer", "cpm", "dcma", "earned-value", "schedule"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Floors = latest releases at the last audit (2026-10-28), so even an install that ignores
# uv.lock cannot pull an older, vulnerable version. Bump them when you upgrade the lock.
dependencies = [
    "numpy>=2.4.6",  # imported directly; 2.4.6 is the last numpy for Python 3.11 in uv.lock
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "streamlit>=1.66.1",
]

[project.optional-dependencies]
# Differential check against MPXJ (independent Java reader); needs a JDK on PATH (21 or 25 LTS).
crosscheck = ["mpxj>=16.10.0", "jpype1>=1.7.1"]

[project.scripts]
xerscope = "xerscope.cli:main"

[dependency-groups]
# hypothesis: property-based fuzzing of the XER boundary (tests/test_fuzz_parser.py), test time only
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    # code fitness (scripts/fitness.py): exact versions, the baseline it checks against holds
    # their numbers and a new release can score the same code differently
    "complexipy==8.3.0",
    "deptry==0.25.1",
    "import-linter==2.16",
    "mypy==2.4.1",
    "radon==6.0.1",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xerscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "oracle(kind): where the expected values come from: p6, mpxj, standard, property or characterization (tests/conftest.py)",
]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
    # a date read without a format is a guess: every date of the app is "YYYY-MM-DD HH:MM" (ISO 8601)
    "error:Could not infer format:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/reference/data"]  # third-party corpora, not ours to format

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, imports, pyupgrade, simplify, comprehensions, return, pylint basics
# D: docstrings, PEP 257 (CONTRIBUTING.md, Docstrings)
select = ["E", "F", "W", "B", "I", "UP", "SIM", "C4", "PIE", "RET", "PLE", "PLW", "PLR0124", "PLC0206", "D"]
# C408: dict(...) reads better in Plotly layouts. RET504/505: early returns kept for clarity.
ignore = ["C408", "RET504", "RET505", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to src/xerscope. A test's docstring states what the test proves, in prose.
"tests/**" = ["D"]
"scripts/**" = ["D"]
# Docstring debt of main at f98589e: per file, the rules it does not meet yet. A new file has no
# entry; a file brought to the standard loses its line; no line gains a rule.
"src/xerscope/analysis/ask/__init__.py" = ["D205", "D209"]
"src/xerscope/analysis/ask/answer.py" = ["D205", "D209", "D210", "D401", "D403"]
