# Sentences for the Gantt Ask field, each with the filter a planner means, written by hand
# on the demo series (`xerscope sample --weeks 8`, latest update, data date 2026-10-19) and
# the tests' generic lexicon (tests/asklex.py). `expect` is the filter in canonical form
# (query.canonical): atoms status:…, float:…, wbs:CODE, code:Type=Value, resource:SHORT,
# milestone, loe, word:w, id:ID, late, tf/od/rd/pct with <, <=, =, >=, > and d, h or %,
# start/finish/active:[from,to), constraint:any|hard|soft, pred, succ, longest; !x, (a | b),
# (a & b), children sorted, the conjuncts of the sentence joined by " & ". "" = no filter.
# `ignored`, when given, is the words the sentence holds that nothing reads. The test scores
# the share right against FLOORS in tests/test_query.py.

[[case]]
text = "tâches critiques"  # battery; « tâches » does not filter the type (L3)
expect = "float:Critical"

[[case]]
text = "activités critiques non démarrées"  # battery
expect = "float:Critical & status:Not started"

[[case]]
text = "non critique"  # battery; H1: the complement, not Critical
expect = "!float:Critical"

[[case]]
text = "pas critique"  # battery
expect = "!float:Critical"

[[case]]
text = "hors chemin critique"  # battery
expect = "!float:Critical"

[[case]]
text = "jalons"  # battery
expect = "milestone"

[[case]]
text = "jalons en retard"  # battery; H2: late = P6-12 (finish after baseline finish), not Critical
expect = "late & milestone"

[[case]]
text = "jalons non terminés"  # battery; H1
expect = "!status:Complete & milestone"

[[case]]
text = "milestones not started"  # battery
expect = "milestone & status:Not started"

[[case]]
text = "critical milestones"  # battery
expect = "float:Critical & milestone"

[[case]]
text = "en retard"  # battery
expect = "late"

[[case]]
text = "tâches en retard"  # battery
expect = "late"

[[case]]
text = "late activities"  # battery
expect = "late"

[[case]]
text = "behind schedule"  # battery
expect = "late"

[[case]]
text = "marge négative"  # battery
expect = "tf<0d"

[[case]]
text = "negative float"  # battery
expect = "tf<0d"

[[case]]
text = "marge totale nulle"  # battery
expect = "tf=0d"

[[case]]
text = "float zero"  # battery
expect = "tf=0d"

[[case]]
text = "marge inférieure à 5 jours"  # battery
expect = "tf<5d"

[[case]]
text = "float less than 10 days"  # battery
expect = "tf<10d"

[[case]]
text = "en cours"  # battery
expect = "status:In progress"

[[case]]
text = "in progress"  # battery
expect = "status:In progress"

[[case]]
text = "terminées"  # battery
expect = "status:Complete"

[[case]]
text = "completed"  # battery
expect = "status:Complete"

[[case]]
text = "non démarrées"  # battery
expect = "status:Not started"

[[case]]
text = "not started"  # battery
expect = "status:Not started"

[[case]]
text = "restantes"  # battery; L4: remaining work includes in progress
expect = "(status:In progress | status:Not started)"

[[case]]
text = "critique ou terminé"  # battery; M7
expect = "(float:Critical | status:Complete)"

[[case]]
text = "critical or complete"  # battery; M7
expect = "(float:Critical | status:Complete)"

[[case]]
text = "critique et en cours"  # battery
expect = "float:Critical & status:In progress"

[[case]]
text = "critical and in progress"  # battery
expect = "float:Critical & status:In progress"

[[case]]
text = "commence cette semaine"  # battery; ISO week of the data date 2026-10-19
expect = "start:[2026-10-19,2026-10-26)"

[[case]]
text = "starting next week"  # battery; not « setting » (MEC)
expect = "start:[2026-10-26,2026-11-02)"

[[case]]
text = "finissent avant fin décembre"  # battery
expect = "finish:[,2027-01-01)"

[[case]]
text = "due this month"  # battery
expect = "finish:[2026-10-01,2026-11-01)"

[[case]]
text = "LOE"  # battery
expect = "loe"

[[case]]
text = "level of effort"  # battery
expect = "loe"

[[case]]
text = "contraintes"  # battery
expect = "constraint:any"

[[case]]
text = "activités avec contrainte"  # battery
expect = "constraint:any"

[[case]]
text = "hard constraints"  # battery; P6 Professional set (101248)
expect = "constraint:hard"

[[case]]
text = "sans prédécesseur"  # battery
expect = "!pred"

[[case]]
text = "open ends"  # battery
expect = "(!pred | !succ)"

[[case]]
text = "sans successeur"  # battery
expect = "!succ"

[[case]]
text = "longest path"  # battery
