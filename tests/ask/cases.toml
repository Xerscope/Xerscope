expect = ""
ignored = ["pump", "motor"]

[[case]]
text = "motor pump"  # battery
expect = ""
ignored = ["motor", "pump"]

[[case]]
text = ""  # empty
expect = ""

[[case]]
text = "   "  # blank
expect = ""

[[case]]
text = "non critique ou terminé"  # NOT binds tighter than OR
expect = "(!float:Critical | status:Complete)"

[[case]]
text = "pas non critique"  # double negation
expect = "float:Critical"

[[case]]
text = "not not critical"  # double negation
expect = "float:Critical"

[[case]]
text = "ni critique ni terminé"  # ni ... ni
expect = "!float:Critical & !status:Complete"

[[case]]
text = "pas critique et pas terminé"
expect = "!float:Critical & !status:Complete"

[[case]]
text = "not complete"  # H1
expect = "!status:Complete"

[[case]]
text = "non terminées"  # H1
expect = "!status:Complete"

[[case]]
text = "incomplete"
expect = "(status:In progress | status:Not started)"

[[case]]
text = "pas démarré"  # a phrase, not NOT In progress
expect = "status:Not started"

[[case]]
text = "not in progress"  # H1
expect = "!status:In progress"

[[case]]
text = "not near critical"  # H1
expect = "!float:Near critical"

[[case]]
text = "critique et quasi critique"  # same exclusive facet: union
expect = "(float:Critical | float:Near critical)"

[[case]]
text = "en cours et terminées"  # same exclusive facet: union
expect = "(status:Complete | status:In progress)"

[[case]]
text = "critique ou terminé en génie civil"  # OR binds tighter than AND
expect = "(float:Critical | status:Complete) & wbs:CIV"

[[case]]
text = "(critique ou quasi critique) non démarrées"  # parentheses
expect = "(float:Critical | float:Near critical) & status:Not started"

[[case]]
text = "critical milestones or loe"  # milestone and LOE: one type facet
expect = "(loe | milestone) & float:Critical"

[[case]]
text = "critique ET (en cours OU terminé)"
expect = "(status:Complete | status:In progress) & float:Critical"

[[case]]
text = "critiques, non démarrées"  # comma = and
expect = "float:Critical & status:Not started"

[[case]]
text = "critical but not started"  # but = and
expect = "float:Critical & status:Not started"

[[case]]
text = "sauf jalons"
expect = "!milestone"

[[case]]
text = "except LOE"
expect = "!loe"

[[case]]
text = "pas en génie civil"
expect = "!wbs:CIV"

[[case]]
text = "or"  # dangling operator
expect = ""

[[case]]
text = "critical or"  # dangling operator
expect = "float:Critical"

[[case]]
text = "not"  # dangling operator
expect = ""

[[case]]
text = "((critique)"  # unbalanced parentheses
expect = "float:Critical"

[[case]]
text = "critique)"  # stray parenthesis
expect = "float:Critical"

[[case]]
text = "C3020"  # exact ID
expect = "id:C3020"

[[case]]
text = "c3020 c3030"  # two IDs: union
expect = "(id:C3020 | id:C3030)"

[[case]]
text = "k5020 non terminé"
expect = "!status:Complete & id:K5020"

[[case]]
text = "A1000"  # M8: an unknown ID is never read as another
expect = ""
ignored = ["a1000"]

[[case]]
text = "C3021"  # M8: one digit from C3020, not read as it
expect = ""
ignored = ["c3021"]

[[case]]
text = "critical jalons"  # mixed
expect = "float:Critical & milestone"

[[case]]
