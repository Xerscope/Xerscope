name: image

# Builds the container image and publishes it to GitHub's registry, so a machine without a
# terminal (a NAS running Container Manager) only pulls it:
#   ghcr.io/xerscope/xerscope:latest            every push to main   (Dockerfile)
#   ghcr.io/xerscope/xerscope-remote:latest     same, all-in-one     (Dockerfile.remote)
#   ghcr.io/xerscope/xerscope:v1.2.3            every tag v*; plus a sha-<short> tag each build
# The owner is lowercased by metadata-action (ghcr.io requires it). Both packages are
# private because the repository is: pulling needs a token with read:packages (docs/deploy.md).
# The app image also goes to Docker Hub as mish1ma/xerscope (private repository), because
# Synology Container Manager logs in to Docker Hub natively and rejects ghcr.io. Needs the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (hub.docker.com > Account
# settings > Personal access tokens, Read & Write); the push is skipped when they are absent.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                  # one image failing must not cancel the other
      matrix:
        include:
          - image: xerscope
            dockerfile: Dockerfile
            dockerhub: mish1ma/xerscope
          - image: xerscope-remote
            dockerfile: Dockerfile.remote
            dockerhub: mish1ma/xerscope-remote   # pushed only if DOCKERHUB_REMOTE=true (free plan: 1 private repo)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            name=docker.io/${{ matrix.dockerhub }},enable=${{ secrets.DOCKERHUB_TOKEN != '' && (matrix.image == 'xerscope' || vars.DOCKERHUB_REMOTE == 'true') }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
