# Oracle Primavera P6 Professional 24 — Check Schedule (Tools > Check Schedule).
#
# The 14 checks of the P6 Professional 24 User Guide ("Check Schedule"), plus the out-of-sequence and dangling
# checks a P6 Professional Check Schedule report prints; in the order and groups of the guide ("Check
# Schedule", F88968_01 page 101393). Out of sequence and dangling start / finish are absent from
# that help page; a P6 Professional report prints them, so they close the list (P6-15..17).
# Populations follow the P6 Professional 24 help of the Check Schedule dialog
# (https://docs.oracle.com/cd/F88968_01/client_help/en_US/101248.htm); where it is silent,
# Oracle's help for each section of the Schedule Check Report (P6 EPPM, pages 46277-46291).
# Every percentage is: items found / items in the checked subset.
#
# Thresholds: P6 compares hours; 352 h (= 44 days x 8 h) is used for "x" below.
# Targets: the defaults of the Check Schedule dialog as documented for P6 EPPM 25
# (https://docs.oracle.com/cd/G18294_01/p6help/en/91574.htm: "should be less than 5%", "less
# than 1%", "greater than 90%", BEI "0.95 or greater"); the P6 Professional help does not print
# them. Set them to what your dialog shows so pass/fail matches your report.
# Constraint sets: P6 Professional help, Check Schedule dialog
# (https://docs.oracle.com/cd/G18296_01/client_help/en_US/101248.htm): hard = Mandatory Start,
# Start On, Mandatory Finish, Finish On; soft = Start/Finish On or Before/After, As Late As
# Possible. (P6 EPPM counts only the two Mandatory constraints as hard.)

[standard]
id = "P6"
name = "P6 Check Schedule"
description = "Oracle Primavera P6 Professional 24 Check Schedule (17 checks)"
source = "https://docs.oracle.com/cd/F88968_01/English/User_Guides/p6_pro_user/101393.htm"

# --- Inflexibility and Inefficiency -------------------------------------------------------

[[metric]]
id = "P6-01"
group = "Inflexibility and Inefficiency"
name = "Logic"
description = "Activities missing predecessors or successors"
rule = "p6_01_logic"
target = "< 5%"
source = "101248: completed and WBS summary activities not included; started activities and start milestones need no predecessor; a finish milestone without successor is counted, as a P6 Professional r22.12 report shows (Ten Six); external links pass (46291)"

[[metric]]
id = "P6-02"
group = "Inflexibility and Inefficiency"
name = "Hard constraints"
description = "Constraints that prevent activities being moved (Mandatory Start, Start On, Mandatory Finish, Finish On)"
rule = "p6_02_hard_constraints"
target = "< 1%"
source = "46286: WBS summary, actual-finish and LOE removed; start constraints ignored once started"

[[metric]]
id = "P6-03"
group = "Inflexibility and Inefficiency"
name = "Soft constraints"
description = "Constraints that do not prevent activities being moved"
rule = "p6_03_soft_constraints"
target = "< 5%"
source = "46285: Start on or before / on or after, Finish on or before / on or after, As late as possible"

[[metric]]
id = "P6-04"
group = "Inflexibility and Inefficiency"
name = "Large durations"
description = "Activities that have a remaining duration greater than 352 hours"
rule = "p6_04_large_durations"
target = "< 5%"
source = "101248: completed, WBS summary and LOE not included; milestones also out, as a P6 Professional r22.12 report shows (Ten Six) and EPPM's 46282 states"

[[metric]]
id = "P6-05"
group = "Inflexibility and Inefficiency"
name = "Long lags"
description = "Relationships with a lag duration greater than 352 hours"
rule = "p6_05_long_lags"
target = "< 5%"
source = "46288: links between two actual-finished activities removed"

[[metric]]
id = "P6-06"
group = "Inflexibility and Inefficiency"
name = "Large float"
description = "Activities with total float greater than 352 hours"
rule = "p6_06_large_float"
target = "< 1%"
source = "46284: WBS summary, actual-finish and LOE removed"

[[metric]]
id = "P6-07"
group = "Inflexibility and Inefficiency"
name = "Relationship types"
description = "The majority of relationships should be Finish to Start"
rule = "p6_07_relationship_types"
target = "> 90%"
source = "46287: actual = share of FS links in the subset"

[[metric]]
id = "P6-08"
group = "Inflexibility and Inefficiency"
name = "Lags"
description = "Relationships with a positive lag duration"
rule = "p6_08_lags"
target = "< 5%"
source = "46289"

# --- Inaccuracy -----------------------------------------------------------------------------

[[metric]]
id = "P6-09"
group = "Inaccuracy"
name = "Negative lags"
description = "Relationships with a lag duration of less than 0"
rule = "p6_09_negative_lags"
target = "< 1%"
source = "46290: links between two actual-finished activities removed"

[[metric]]
id = "P6-10"
group = "Inaccuracy"
name = "Invalid progress dates"
description = "Activities with invalid progress dates (forecast before, or actual after, the data date)"
rule = "p6_10_invalid_progress_dates"
target = "< 1%"
source = "101248: not started, start before the data date; in progress, remaining early start before it or actual start after it; completed, actual finish after it. Completed before the data date, WBS summary and LOE not included"

[[metric]]
id = "P6-11"
group = "Inaccuracy"
name = "Resource / cost"
description = "Activities that do not have an expense or a resource assigned"
rule = "p6_11_resource_cost"
target = "< 1%"
source = "46279: WBS summary, milestones and LOE removed (completed activities stay in); a role assignment counts"

# --- Lateness -----------------------------------------------------------------------------------

[[metric]]
id = "P6-12"
group = "Lateness"
name = "Late activities"
description = "Activities scheduled to finish later than the project baseline"
rule = "p6_12_late_activities"
target = "< 5%"
source = "101248: milestones, WBS summary and LOE not included. A P6 Professional report (3,408 activities, project baseline V5) checks 2,335 activities (completed out) and lists 51 late ones, all in progress: not-started activities past their BL Project Finish are not listed. 46278: finish variance in working time"

[[metric]]
id = "P6-13"
group = "Lateness"
name = "BEI"
description = "Baseline Execution Index"
rule = "p6_13_bei"
target = "> 0.95"
source = "101248 reads 'baseline activities calculated to finish before the data date', but a P6 Professional report prints 808 completed / 3,143 baseline activities (every baseline activity, whatever its finish date; target shown as > 0.95). The report wins. Milestones, WBS summary and LOE not included on either side"

[[metric]]
id = "P6-14"
group = "Lateness"
name = "Negative float"
description = "Activities with a total float less than 0"
rule = "p6_14_negative_float"
target = "< 1%"
source = "46283: WBS summary, actual-finish and LOE removed"

[[metric]]
id = "P6-15"
group = "Inaccuracy"
name = "Out of sequence"
description = "Activities which are completed or in-progress before their predecessors"
rule = "p6_15_out_of_sequence"
target = "< 2%"
source = "P6 Professional Check Schedule report (data date 25-Oct-26): 7 pairs listed, 6 activities counted against the total of activities; each started activity has an FS predecessor not completed at the data date (SS: not started); a predecessor that finished late but before the data date is not listed"

[[metric]]
id = "P6-16"
group = "Inaccuracy"
name = "Dangling start"
description = "Activities with start dates that are not driven by predecessors"
rule = "p6_16_dangling_start"
target = "<= 0%"
source = "P6 Professional Check Schedule report (Dangling Activities, 'Ignore In Progress Activities' checked): predecessors exist but none FS or SS; an activity without any predecessor is listed under Logic only; milestones out (0 on the report for milestones with FF / SS logic only)"

[[metric]]
id = "P6-17"
group = "Inaccuracy"
name = "Dangling finish"
description = "Activities with finish dates that do not drive successors"
rule = "p6_17_dangling_finish"
target = "<= 0%"
source = "P6 Professional Check Schedule report (Dangling Activities): successors exist but none FS or FF; an activity without any successor is listed under Logic only; milestones out (0 on the report for milestones with FF / SS logic only)"
