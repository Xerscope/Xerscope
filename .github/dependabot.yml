version: 2
updates:
  - package-ecosystem: uv          # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker           # FROM lines in Dockerfile
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose   # image: lines (tailscale, caddy) in the Funnel stack
    directory: /deploy
    schedule:
      interval: weekly
