# Oracle Primavera P6 Professional 24 — Check Schedule (Tools > Check Schedule).
#
# The 14 checks of the P6 Professional 24 User Guide ("Check Schedule"), plus the out-of-sequence and dangling
# checks a P6 Professional Check Schedule report prints; in the order and groups of the guide ("Check
# Schedule", F88968_01 page 101393). Out of sequence and dangling start / finish are absent from
# that help page; a P6 Professional report prints them, so they close the list (P6-15..17).
# Populations follow the P6 Professional 24 help of the Check Schedule dialog
# (https://docs.oracle.com/cd/F88968_01/client_help/en_US/101248.htm); where it is silent,
# Oracle's help for each section of the Schedule Check Report (P6 EPPM, pages 46277-46291).
# Every percentage is: items found / items in the checked subset.
#
# Thresholds: P6 compares hours; 352 h (= 44 days x 8 h) is used for "x" below.
# Targets: the defaults of the Check Schedule dialog as documented for P6 EPPM 25
# (https://docs.oracle.com/cd/G18294_01/p6help/en/91574.htm: "should be less than 5%", "less
# than 1%", "greater than 90%", BEI "0.95 or greater"); the P6 Professional help does not print
# them. BEI is "> 0.95" as report R1 prints it (P6-13). Set them to what your dialog shows so
# pass/fail matches your report.
# Constraint sets: P6 Professional help, Check Schedule dialog
# (https://docs.oracle.com/cd/G18296_01/client_help/en_US/101248.htm): hard = Mandatory Start,
# Start On, Mandatory Finish, Finish On; soft = Start/Finish On or Before/After, As Late As
# Possible. (P6 EPPM counts only the two Mandatory constraints as hard.)

[standard]
id = "P6"
name = "P6 Check Schedule"
description = "Oracle Primavera P6 Professional 24 Check Schedule (18 lines: the 17 checks, Invalid Progress Dates on two lines)"
source = "https://docs.oracle.com/cd/F88968_01/English/User_Guides/p6_pro_user/101393.htm"

# --- Inflexibility and Inefficiency -------------------------------------------------------

[[metric]]
id = "P6-01"
group = "Inflexibility and Inefficiency"
name = "Logic"
description = "Activities missing predecessors or successors"
rule = "p6_01_logic"
target = "< 5%"
source = "101248: completed and WBS summary activities not included; started activities need no predecessor (101248 also exempts start milestones; P6 Professional 26.8 and r22.12 reports list a not-started start milestone without predecessor: the reports win); a finish milestone without successor is counted (same reports); external links pass (46291)"

[[metric]]
id = "P6-02"
group = "Inflexibility and Inefficiency"
name = "Hard Constraints"
description = "Constraints that prevent activities being moved (Mandatory Start, Start On, Mandatory Finish, Finish On)"
rule = "p6_02_hard_constraints"
target = "< 1%"
source = "101248 (P6 Professional help, Hard Constraints) and 46286: completed, WBS summary and LOE removed; start constraints ignored once started"

[[metric]]
id = "P6-03"
group = "Inflexibility and Inefficiency"
name = "Soft Constraints"
description = "Constraints that do not prevent activities being moved"
rule = "p6_03_soft_constraints"
target = "< 5%"
source = "101248 (P6 Professional help, Soft Constraints) and 46285: Start on or before / on or after, Finish on or before / on or after, As late as possible; completed, WBS summary and LOE removed; start constraints ignored once started"

[[metric]]
id = "P6-04"
group = "Inflexibility and Inefficiency"
name = "Large Durations"
description = "Activities that have a remaining duration greater than 352 hours"
rule = "p6_04_large_durations"
params = { limit_hours = 352 }  # the dialog's "x", in hours
target = "< 5%"
source = "101248: completed, WBS summary and LOE not included; milestones also out, as a P6 Professional r22.12 report shows (Ten Six) and EPPM's 46282 states. A P6 Professional 26.8 report on a shareable synthetic project (tests/test_p6_checksched.py) gives the same population: 1 / 11, its 14 activities less 2 milestones and 1 completed"

[[metric]]
id = "P6-05"
group = "Inflexibility and Inefficiency"
name = "Long Lags"
description = "Relationships with a lag duration greater than 352 hours"
rule = "p6_05_long_lags"
params = { limit_hours = 352 }  # the dialog's "x", in hours
target = "< 5%"
source = "101248 (P6 Professional help, Long Lags) and 46288: links between two actual-finished activities removed"

[[metric]]
id = "P6-06"
group = "Inflexibility and Inefficiency"
name = "Large Float"
description = "Activities with total float greater than 352 hours"
rule = "p6_06_large_float"
params = { limit_hours = 352 }  # the dialog's "x", in hours
target = "< 1%"
source = "101248 (P6 Professional help, Large Float) and 46284: WBS summary, actual-finish and LOE removed"

[[metric]]
id = "P6-07"
group = "Inflexibility and Inefficiency"
name = "Relationship Types"
description = "The majority of relationships should be Finish to Start"
rule = "p6_07_relationship_types"
target = "> 90%"
source = "101248 (P6 Professional help, Relationship Types): relationships between completed activities not included; 46287: actual = share of FS links in the subset"

[[metric]]
id = "P6-08"
group = "Inflexibility and Inefficiency"
name = "Positive Lags"
description = "Relationships with a positive lag duration"
rule = "p6_08_lags"
target = "< 5%"
source = "101248 (P6 Professional help, Lags): relationships between completed activities not included; 46289"

# --- Inaccuracy -----------------------------------------------------------------------------

[[metric]]
id = "P6-09"
group = "Inaccuracy"
name = "Negative Lags"
description = "Relationships with a lag duration of less than 0"
rule = "p6_09_negative_lags"
target = "< 1%"
source = "101248 (P6 Professional help, Negative Lags) and 46290: links between two actual-finished activities removed"

[[metric]]
id = "P6-10a"
group = "Inaccuracy"
name = "Invalid Progress Before Data Date"
description = "Incomplete activities before the data date"
rule = "p6_10a_invalid_progress_before"
target = "< 1%"
source = "101248: not started, start before the data date; in progress, remaining early start before it. Completed before the data date, WBS summary and LOE not included. P6 Professional 26.8 reports it on its own line (Invalid Progress Before Data Date)"

[[metric]]
id = "P6-10b"
group = "Inaccuracy"
name = "Invalid Progress After Data Date"
description = "Activities with actual dates after the data date"
rule = "p6_10b_invalid_progress_after"
target = "< 1%"
source = "101248: in progress, actual start after the data date; completed, actual finish after it. Completed before the data date, WBS summary and LOE not included. P6 Professional 26.8 reports it on its own line (Invalid Progress After Data Date)"

[[metric]]
id = "P6-11"
group = "Inaccuracy"
name = "Resource / Cost"
description = "Activities that do not have an expense or a resource assigned"
rule = "p6_11_resource_cost"
target = "< 1%"
source = "101248 (P6 Professional help, Resource / Cost) and 46279: WBS summary, milestones and LOE removed (completed activities stay in); a role assignment counts"

# --- Lateness -----------------------------------------------------------------------------------

[[metric]]
id = "P6-12"
group = "Lateness"
name = "Late Activities"
description = "Activities scheduled to finish later than the project baseline"
rule = "p6_12_late_activities"
target = "< 5%"
source = "101248: milestones, WBS summary and LOE not included; a P6 Professional Check Schedule report (R1, docs/standards.md) checks the Large Durations population, so completed activities are out too. No baseline counterpart = late when the remaining early finish is later than the planned finish. 46278: finish variance in working time. A P6 Professional 26.8 report on a shareable synthetic project (tests/test_p6_checksched.py) shows the same: 2 / 11, its completed activity out of the 12 non-milestone activities"

[[metric]]
id = "P6-13"
group = "Lateness"
name = "BEI"
description = "Baseline Execution Index"
rule = "p6_13_bei"
target = "> 0.95"
source = "101248 reads 'baseline activities calculated to finish before the data date', but a P6 Professional Check Schedule report (R1) divides by every baseline activity, whatever its finish date (target shown as > 0.95). The report wins. Milestones, WBS summary and LOE not included on either side. A P6 Professional 26.8 report on a shareable synthetic project (tests/test_p6_checksched.py) shows the same: BEI 1 / 12, every non-milestone activity, where 3 were due by the data date"

[[metric]]
id = "P6-14"
group = "Lateness"
name = "Negative Float"
description = "Activities with a total float less than 0"
rule = "p6_14_negative_float"
target = "< 1%"
source = "101248 (P6 Professional help, Negative Float) and 46283: WBS summary, actual-finish and LOE removed"

[[metric]]
id = "P6-15"
group = "Inaccuracy"
name = "Out of Sequence"
description = "Activities which are completed or in-progress before their predecessors"
rule = "p6_15_out_of_sequence"
target = "< 2%"
source = "P6 Professional Check Schedule report (R1): pairs listed, activities counted once against the total of activities; each started activity has an FS predecessor not completed at the data date (SS: not started); a predecessor that finished late but before the data date is not listed"

[[metric]]
id = "P6-16"
group = "Inaccuracy"
name = "Dangling Start Activities"
description = "Activities with start dates that are not driven by predecessors"
rule = "p6_16_dangling_start"
target = "<= 0%"
source = "P6 Professional Check Schedule report (R1, Dangling Activities, 'Ignore In Progress Activities' checked): predecessors exist but none FS or SS; an activity without any predecessor is listed under Logic only; milestones out (0 on the report for milestones with FF / SS logic only)"

[[metric]]
id = "P6-17"
group = "Inaccuracy"
name = "Dangling Finish Activities"
description = "Activities with finish dates that do not drive successors"
rule = "p6_17_dangling_finish"
target = "<= 0%"
source = "P6 Professional Check Schedule report (R1, Dangling Activities): successors exist but none FS or FF; an activity without any successor is listed under Logic only; milestones out (0 on the report for milestones with FF / SS logic only)"
