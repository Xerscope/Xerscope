[project]
name = "xerscope"
version = "0.1.0"
description = "Weekly Primavera P6 XER schedule analysis and visualisation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quentin Gouttaya", email = "beatsgr3y@gmail.com" }]
keywords = ["primavera", "p6", "xer", "cpm", "dcma", "earned-value", "schedule"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Floors = latest releases at the last audit (2026-10-28), so even an install that ignores
# uv.lock cannot pull an older, vulnerable version. Bump them when you upgrade the lock.
dependencies = [
    "numpy>=2.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "streamlit>=1.66.1",
]

[project.optional-dependencies]
# Differential check against MPXJ (independent Java reader); needs a JDK on PATH (21 or 25 LTS).
crosscheck = ["mpxj>=16.10.0", "jpype1>=1.7.1"]

[project.scripts]
xerscope = "xerscope.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # code fitness (scripts/fitness.py): exact versions, the baseline it checks against holds
    # their numbers and a new release can score the same code differently
    "complexipy==8.3.0",
    "deptry==0.25.1",
    "import-linter==2.16",
    "mypy==2.4.1",
    "radon==6.0.1",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xerscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "oracle(kind): where the expected values come from: p6, mpxj, standard, property or characterization (tests/conftest.py)",
]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
    # a date read without a format is a guess: every date of the app is "YYYY-MM-DD HH:MM" (ISO 8601)
    "error:Could not infer format:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/reference/data"]  # third-party corpora, not ours to format

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, imports, pyupgrade, simplify, comprehensions, return, pylint basics
select = ["E", "F", "W", "B", "I", "UP", "SIM", "C4", "PIE", "RET", "PLE", "PLW", "PLR0124", "PLC0206"]
# C408: dict(...) reads better in Plotly layouts. RET504/505: early returns kept for clarity.
ignore = ["C408", "RET504", "RET505", "SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"  # the oldest supported: the same count whichever Python runs it
# untyped third-party packages (pandas, plotly, streamlit) read as Any: the count is about our code
ignore_missing_imports = true

[tool.deptry.package_module_name_map]
jpype1 = "jpype"

[tool.deptry.per_rule_ignores]
DEP001 = ["org"]  # Java packages, imported through JPype (verify/)
DEP002 = ["pyarrow"]  # pandas' Parquet engine (export.py), never imported by name

[project.urls]
Repository = "https://github.com/Xerscope/xerscope"
