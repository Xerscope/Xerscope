name: mutation

# Mutation score of the modules named in [tool.mutmut] (pyproject.toml) against
# tests/mutation_baseline.json: scripts/mutation.py fails when the share of killed mutants of a
# module goes down. The job summary gives the counts on every run.
#
# Every Monday and by hand, never on a pull request: a full run takes about 50 minutes on a
# GitHub runner (a surviving mutant runs every test that reaches it). A separate workflow: every
# job of tests.yml gates the publish, this one must not.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"  # every Monday, after the tests run

# One run per branch at a time; a newer one waits for the run under way and replaces the one waiting.
concurrency:
  group: mutation-${{ github.ref }}

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"  # the baseline's
      - run: uv sync --locked
      # mutmut limits the CPU time of a mutant, not its memory. Two mutants of the calendar blob
      # parser loop without reading their input and grow a list without end; the first run on
      # GitHub ended on a runner shutdown. Under the limit they end on a MemoryError: killed.
      - name: Mutants, each process held to 4 GB of address space
        run: |
          ulimit -v 4000000
          uv run mutmut run
      - run: uv run python scripts/mutation.py --markdown "$GITHUB_STEP_SUMMARY" --check tests/mutation_baseline.json
