# The local model study on your own machine (docs/deploy.md §12); built and run by you only, no image
# is pushed anywhere:
#
#   docker compose -f compose.yaml -f compose.silo.yaml -f compose.gpu.yaml up -d --build
#   docker compose -f compose.yaml -f compose.silo.yaml -f compose.gpu.yaml run --rm study   # demo series
#   ... run --rm study --data /data   # your exports
#
# An override of compose.yaml and compose.silo.yaml: the model and the study join the app on `silo`,
# the internal network that file creates, so none of them has a route out of the machine. The model
# publishes no port: only a container on the silo reaches it, never the host. The study's report
# lands in ./study (writable by the image's user, uid 65532).
#
# Required variables (Compose stops without them):
#   XERSCOPE_LLM_IMAGE   the llama.cpp CUDA server image, pinned by digest
#   XERSCOPE_GATE_IMAGE  a socat image, pinned by digest (compose.silo.yaml)
#   XERSCOPE_MODELS      the folder of .gguf files, mounted read-only
#   XERSCOPE_MODEL_FILE  the .gguf to serve, in that folder
# Optional: XERSCOPE_LLM_CTX (context tokens, 16384), XERSCOPE_LLM_KV (cache type of keys and values,
# q8_0), XERSCOPE_LLM_GPU_LAYERS (layers on the card, 99 = all; fewer puts the rest in RAM, for a
# model larger than the card), XERSCOPE_LLM_CPU_MOE (a mixture-of-experts model: blocks whose experts
# stay in RAM, 0 = none), XERSCOPE_LLM_MEM_LIMIT (the model's memory cap, 0 = none: the machine's).
services:
  xerscope:
    environment:
      XERSCOPE_AGENT: ${XERSCOPE_AGENT:-on}  # the Gantt Ask field asks the model what its grammar does not read
      XERSCOPE_LLM_URL: http://llm:8080      # the model's name on the silo; the agent accepts no other host
    depends_on: [llm]

  llm:
    image: ${XERSCOPE_LLM_IMAGE:?pin ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:<digest>}
    # No -hf / --hf-repo and no model URL: the server downloads nothing, it reads the file you put in the folder.
    command:
      - --model
      - /models/${XERSCOPE_MODEL_FILE:?name of the .gguf file in XERSCOPE_MODELS}
      - --host
      - 0.0.0.0  # inside the silo only: no port is published, the host cannot reach it
      - --port
      - "8080"
      - --n-gpu-layers
      - ${XERSCOPE_LLM_GPU_LAYERS:-99}  # all on the card; fewer: the rest read from RAM, slower (§12)
      - --n-cpu-moe
      - ${XERSCOPE_LLM_CPU_MOE:-0}  # a MoE model larger than the card: its experts in RAM
      - --ctx-size
      - ${XERSCOPE_LLM_CTX:-16384}
      - --flash-attn
      - "on"
      - --cache-type-k
      - ${XERSCOPE_LLM_KV:-q8_0}  # half the cache of f16 for the same context (§12, sizing)
      - --cache-type-v
      - ${XERSCOPE_LLM_KV:-q8_0}
    networks: [silo]
    volumes:
      - ${XERSCOPE_MODELS:?folder of .gguf files}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${XERSCOPE_LLM_MEM_LIMIT:-0}  # 0: no cap but the machine's (Docker Desktop: .wslconfig, §12)
    pids_limit: 256
    restart: unless-stopped

  study:  # the feasibility study (scripts/llm_study.py), run on demand; it reaches the model as http://llm:8080
    image: xerscope:latest
    profiles: [study]
    entrypoint: ["/app/.venv/bin/python", "/study/scripts/llm_study.py", "--url", "http://llm:8080", "--out", "/out/report.md"]
    command: []
    networks: [silo]
    depends_on: [llm]
    volumes:
      - ./scripts:/study/scripts:ro
      - ./tests/llm_study:/study/tests/llm_study:ro
      - ${XERSCOPE_EXPORTS:-./exports}:/data:ro
      - ./study:/out
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 0  # no cap but the machine's
    pids_limit: 128

