# The trade words a planner says in one language about a file written in the other, read
# as one by the Gantt Ask field's grammar (analysis/query.py): "mécanique" finds the node
# "Mechanical & electrical", "commissioning" the node "Mise en service". Generic planning
# and construction vocabulary only; a company's own words go in a file of its own, in the
# folder XERSCOPE_LEXICON names (same format, any name, *.toml). Accents and case do not
# matter: every word is folded before use.
#
# [[group]]
# words = ["mot", "word", "abbr"]   # every word of a group stands for every other

