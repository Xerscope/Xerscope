[server]
headless = true
# Streamlit listens on every interface by default: anyone on the network could open your
# schedules. Keep it local; use `xerscope app --host 0.0.0.0` only on purpose.
address = "localhost"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 200  # MB, per file
# Serves app/static/ (the fonts below, nothing else) at app/static/: the fonts come from the
# app itself, no request leaves for a font host.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# viewer: the ⋮ menu keeps the visitor's options (theme System / Light / Dark, print) and hides
# the developer ones (rerun, clear cache, deploy). Charts take the new theme at the next rerun.
toolbarMode = "viewer"
# No CSV download or clipboard copy from the tables: they show the real schedule. Exports
# go through the app's own buttons (anonymised lists, Debug diagnostic, XER extract, Power BI).
disableDataExport = true

# Light and dark themes; Streamlit follows the browser and the user can switch in Settings.
# Warm neutrals (stone), soft borders, one petrol accent: linkColor, the same as ACCENT in
# viz/charts.py (#1D6A73 in light mode, #6CC0C9 in dark mode). primaryColor fills checkboxes,
# toggles and selected chips under white text, so it stays a deep petrol in both modes (>= 4.5:1
# under white, >= 3:1 on the page).
# Red, amber and green are reserved for status (fail / warning / pass) and never decorate.
# The chart and Gantt colours in viz/charts.py and viz/gantt.py must match these
# (tests/test_analysis_and_viz.py).
[theme]
# Variable fonts (weight axis in the file), latin subset, SIL OFL 1.1: app/static/OFL-*.txt.
# The same family is set on the Plotly charts (viz/charts.py) and the Gantt (viz/gantt.css).
font = "Onest, sans-serif"
headingFont = "Onest, sans-serif"
codeFont = "JetBrains Mono, monospace"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
headingFontSizes = ["1.85rem", "1.3rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
paddingTop = "2.5rem"

[theme.light]
primaryColor = "#1D6A73"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#F7F5F1"
textColor = "#1C1917"
linkColor = "#1D6A73"
borderColor = "#E4DFD6"
dataframeBorderColor = "#E4DFD6"
dataframeHeaderBackgroundColor = "#F7F5F1"
dataframeHeaderTextColor = "#57534E"
redColor = "#C0392B"
greenColor = "#2E7D32"
orangeColor = "#A15C00"
blueColor = "#1D6A73"

[theme.light.sidebar]
backgroundColor = "#F4F1EC"
secondaryBackgroundColor = "#FAF8F5"

[theme.dark]
primaryColor = "#21787F"
backgroundColor = "#16181D"
secondaryBackgroundColor = "#1B1D23"
textColor = "#ECE9E4"
linkColor = "#6CC0C9"
borderColor = "#2D3139"
dataframeBorderColor = "#2D3139"
dataframeHeaderBackgroundColor = "#1B1D23"
dataframeHeaderTextColor = "#B8B2A8"
redColor = "#F05252"
greenColor = "#22C55E"
orangeColor = "#FAB219"
blueColor = "#6CC0C9"

[theme.dark.sidebar]
backgroundColor = "#121418"
secondaryBackgroundColor = "#1B1D23"

[[theme.fontFaces]]
family = "Onest"
url = "app/static/Onest-latin-wght.woff2"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-latin-wght.woff2"
style = "normal"
