# Trivy exceptions for the Caddy image of deploy/compose.yaml, read by the CI job deploy only.
# Each finding is fixed upstream but not in the latest Caddy release (2.11.8: go-jose v4.1.5),
# and none is reachable in this stack: Caddy listens in plain HTTP on 127.0.0.1:8080 with
# auto_https off (no TLS, no ACME), h2c is off unless configured (caddyhttp/app.go), and there
# is no file_server.
# Each entry expires: the job turns red again and the list is reviewed (a newer Caddy image
# drops the entry, or the entry is renewed with its reason).
vulnerabilities:
  - id: CVE-2026-116587
    statement: go-jose JWK parsing, used by ACME only; auto_https off
    expired_at: 2026-12-02
