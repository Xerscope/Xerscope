name: codeql

# Semantic static analysis of the Python sources (GitHub CodeQL, free on a public repository):
# every push to main, every pull request, and once a week so new queries run on unchanged code.
# Findings land in Security > Code scanning; the workflow needs no secret and writes nothing but
# the SARIF upload (security-events: write).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"                           # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write                       # upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
