# Trivy exceptions for the Caddy image of deploy/compose.yaml, read by the CI job deploy only.
# Each finding is fixed upstream but not in the latest Caddy release (2.11.7: Go 1.26.8,
# go-jose v4.1.5, x/net v0.59.0; its alpine packages not rebuilt), and none is reachable in
# this stack: Caddy listens in plain HTTP on 127.0.0.1:8080 with auto_https off (no TLS, no
# ACME), h2c is off unless configured (caddyhttp/app.go), and there is no file_server.
# Each entry expires: the job turns red again and the list is reviewed (a newer Caddy image
# drops the entry, or the entry is renewed with its reason).
vulnerabilities:
  - id: CVE-2026-111497
    statement: brotli-libs, an alpine package the static caddy binary does not load
    expired_at: 2026-12-02
  - id: CVE-2026-92392
    statement: curl and libcurl, alpine packages Caddy never runs
    expired_at: 2026-12-02
  - id: CVE-2026-116587
    statement: go-jose JWK parsing, used by ACME only; auto_https off
    expired_at: 2026-12-02
  - id: CVE-2026-78669
    statement: HTTP/2 SETTINGS flood; the listener is plain HTTP without h2c, so HTTP/1.1 only
    expired_at: 2026-12-02
  - id: CVE-2026-78667
    statement: Range header parsing in http.ServeContent, which only file_server calls
    expired_at: 2026-12-02
  - id: CVE-2026-111943
    statement: crypto/x509 chain verification; Caddy opens no TLS connection (upstream http://app:8501, no ACME)
    expired_at: 2026-12-02
  - id: CVE-2026-97031
    statement: crypto/tls ECH handling; Caddy terminates no TLS, tailscaled does
    expired_at: 2026-12-02
