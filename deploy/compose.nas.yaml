# Synology Container Manager with Projects (DSM 7.2+): Project > Create > from this folder.
# Before that, in File Station, put next to it: Caddyfile (with your password hash inside),
# tailscale-serve.json and an empty tailscale-state/ folder, all from deploy/.
# The image is built by GitHub Actions (.github/workflows/image.yml): nothing to build here.
# Secret URL prefix (optional, same effect as XERSCOPE_PATH on the remote image): change
# the handler key in tailscale-serve.json from "/" to "/<random>". Tailscale strips the
# prefix before proxying, so Caddy and Streamlit keep serving "/": set nothing else.
# Coming from the remote image: its node state is in tailscale-state/node/; the official
# tailscale image reads the root of the folder. Stop the remote container, move the files
# of node/ one level up, then start this project. Never run both with the same state.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: xerscope                              # https://xerscope.<tailnet>.ts.net
    environment:
      TS_AUTHKEY: tskey-auth-REPLACE-ME             # Tailscale admin > Settings > Keys, tag:xerscope
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"                         # log in with the key once; later starts reuse the state
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:xerscope
      TS_NO_LOGS_NO_SUPPORT: "true"                # no diagnostic logs sent to Tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    networks: [egress, internal]                    # egress: outbound to Tailscale only (nothing published)
    cap_drop: [ALL]                                 # userspace networking needs no capability
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.6
    network_mode: service:tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [tailscale]
    read_only: true
    tmpfs:
      - /tmp
      - /data                                       # Caddy's storage (unused: auto_https off)
      - /config
    cap_drop: [ALL]                                 # port 8080 needs none
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  xerscope:
    image: ghcr.io/xerscope/xerscope:latest        # public package, no login; the Docker Hub mirror works too, see docs/deploy.md §8
    environment:
      XERSCOPE_DATA: /data
    volumes:
      - /volume1/<shared-folder>:/data:ro           # the shared folder your XER exports go to (read for Everyone: the app runs as uid 65532)
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
      - /home/nonroot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  egress: {}                                      # ordinary bridge: tailscaled reaches the control plane
  internal:
    internal: true
