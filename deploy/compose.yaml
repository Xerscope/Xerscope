# Remote access through Tailscale Funnel + Caddy, for people who cannot install Tailscale
# (a corporate laptop on its own VPN): https://xerscope.<tailnet>.ts.net/<random>/ from any
# browser, behind a username and password. One stack for a PC and for a NAS.
#
# PC:   cp .env.example .env, fill it in, then from this folder:
#         docker compose up -d
#         docker compose exec tailscale tailscale funnel status
# NAS:  Container Manager > Project > Create from a copy of this folder; the five variables
#       go in a .env file next to this one (Container Manager's Environment fields do not
#       feed the ${...} interpolation below; Compose reads .env by itself).
#
# Variables: TS_AUTHKEY (tagged key, first start only), XERSCOPE_USER, XERSCOPE_PASSWORD_HASH (from
#   caddy hash-password --algorithm bcrypt --bcrypt-cost 10, docs/deploy.md §3), XERSCOPE_PATH (the
#   secret URL prefix, openssl rand -hex 12, no slashes), XERSCOPE_EXPORTS (the folder of
#   the .xer files, e.g. /volume1/<shared-folder>); optional XERSCOPE_MEM_LIMIT (the app's
#   memory cap, default 2g), XERSCOPE_UID and XERSCOPE_GID (the account the app runs as,
#   default 65532). Nothing in this folder is edited.
# No logging: block: Container Manager's Log tab shows only the Docker daemon's default
# driver (Synology sets its own), and an explicit driver, json-file or local, leaves the tab
# empty for that container. The log stays on the NAS either way.
# Limits keep the stack from starving the NAS it shares: a memory and a PID cap per
# container (on a kernel without those cgroups Docker drops the limit with a warning, the
# stack still starts) and bounded tmpfs. No CPU quota: Docker refuses to create a
# container with one on a kernel without CFS bandwidth control.
# The app answers at https://xerscope.<tailnet>.ts.net/<XERSCOPE_PATH>/ only: Caddy strips
# the prefix and returns 404 for every other path before authentication (scanners find every
# *.ts.net name within seconds from the public certificate logs). Streamlit serves "/".
# Nothing touches the host network: tailscaled runs in userspace (no TUN device, no route,
# no DNS change), no port is published, the only outbound traffic is Tailscale's own.
# Funnel must be allowed for the node's tag in the tailnet ACL:
#   "nodeAttrs": [{ "target": ["tag:xerscope"], "attr": ["funnel"] }]
# tailscaled keeps its node identity in the named volume tailscale-state: Docker creates it
# owned by root, the container's user, so it is writable without the capabilities this file
# drops (a bind-mounted host folder belongs to a host user, and root without DAC_OVERRIDE
# cannot write there). Removing the volume makes a new node, which needs a new key.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: xerscope                              # https://xerscope.<tailnet>.ts.net
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}                    # first start only; then delete it here and in the admin console
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"                         # log in with the key once; later starts reuse the state
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:xerscope
      TS_NO_LOGS_NO_SUPPORT: "true"                # no diagnostic logs sent to Tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale          # named volume: the node identity, kept across Builds
      - ./tailscale-serve.json:/config/serve.json:ro
    networks: [egress, internal]                    # egress: outbound to Tailscale only (nothing published)
    read_only: true                                 # in userspace mode containerboot writes only:
    tmpfs:
      - /tmp:size=16m                               # the LocalAPI socket (TS_SOCKET default /tmp/tailscaled.sock)
      - /var/run/tailscale:size=1m                  # its symlink at the CLI's default path (tailscale status)
    cap_drop: [ALL]                                 # userspace networking needs no capability
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  caddy:
    image: ${XERSCOPE_CADDY_IMAGE:-ghcr.io/xerscope/xerscope-caddy:latest}   # caddy + rate_limit, built by
                                                    # .github/workflows/image.yml from caddy/Dockerfile; a
                                                    # Docker Hub copy: XERSCOPE_CADDY_IMAGE=<docker-hub-login>/xerscope-caddy:latest
    network_mode: service:tailscale                 # listens on 127.0.0.1:8080 of that namespace only
    environment:
      XERSCOPE_USER: ${XERSCOPE_USER:?login for the password prompt}
      XERSCOPE_PASSWORD_HASH: ${XERSCOPE_PASSWORD_HASH:?bcrypt hash from caddy hash-password}
      XERSCOPE_PATH: ${XERSCOPE_PATH:?secret URL prefix, e.g. openssl rand -hex 12}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [tailscale]
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /data:size=16m                              # Caddy's storage (unused: auto_https off)
      - /config:size=16m
    cap_drop: [ALL]                                 # port 8080 needs none, but the image's binary carries the
    cap_add: [NET_BIND_SERVICE]                     # file capability cap_net_bind_service (setcap in its
                                                    # Dockerfile): with an empty bounding set the kernel refuses
                                                    # to exec it ("exec /usr/bin/caddy: operation not permitted")
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  xerscope:
    image: ${XERSCOPE_IMAGE:-ghcr.io/xerscope/xerscope:latest}   # built by .github/workflows/image.yml; a private
                                                    # copy on Docker Hub: XERSCOPE_IMAGE=<docker-hub-login>/xerscope:latest
    user: "${XERSCOPE_UID:-65532}:${XERSCOPE_GID:-65532}"   # NAS: a dedicated DSM account, the only one allowed to
                                                    # read the exports folder; default: the image's nonroot user
    command: ["app", "--host", "172.28.0.10", "--port", "8501"]   # the `internal` address only: on the `ai`
                                                    # network below (the model's) the app listens on nothing
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://172.28.0.10:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      XERSCOPE_DATA: /data
      HOME: /home/nonroot                           # an uid outside the image's /etc/passwd would get HOME=/
      XERSCOPE_DATA_LOCKED: "true"                  # the visitor reads /data only: no folder field, no XER upload
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "1"         # MB per uploaded file: only a standard (.toml) can be uploaded
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: none     # tracebacks go to the log, not to the visitor's page
      # XERSCOPE_BASELINE: /data/BL.xer
      # XERSCOPE_LEXICON: /lexicon                   # a folder of *.toml synonym groups for the Gantt Ask field
                                                    # (the company's own words; `xerscope lexicon` prints the format)
      # XERSCOPE_QUERY_URL: https://172.29.0.20:8443 # the optional `llm` service below (profile ai), by its fixed
                                                    # address, over TLS: the Gantt page's Ask field asks it; unset, a
                                                    # keyword grammar answers. The three go together (docs/deploy.md §10):
      # XERSCOPE_QUERY_KEY: ${XERSCOPE_LLM_KEY:-}    # the key the model requires on every request
      # XERSCOPE_QUERY_CA: /run/llm-ca.crt           # the model's own certificate, trusted alone
    volumes:
      - ${XERSCOPE_EXPORTS:-../exports}:/data:ro    # NAS: readable by the XERSCOPE_UID account only
      # - ./llm-certs/llm.crt:/run/llm-ca.crt:ro    # with the `llm` profile: the model's certificate (§10)
    networks:                                       # nothing published: reachable from Caddy only
      internal:
        aliases: [app]
        ipv4_address: 172.28.0.10                   # fixed: Streamlit binds this address alone (command above)                              # Caddy's upstream: in the tailscale namespace Caddy shares,
                                                    # /etc/hosts maps "xerscope" (tailscale's hostname) to tailscale
      # ai:                                         # with the `llm` profile: the model's own network (§10); the app
      #   ipv4_address: 172.29.0.10                 # reaches 172.29.0.20 from here, and listens on nothing here
    read_only: true
    tmpfs:                                          # owned by the app's user: some Docker builds (Synology's)
                                                    # mount a bare tmpfs root-only, and Streamlit then fails
                                                    # reading ~/.streamlit/secrets.toml
      - /tmp:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},mode=1777,size=256m
      - /home/nonroot:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},mode=700,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${XERSCOPE_MEM_LIMIT:-2g}            # one 40 MB export needs about 1 GB parsed (docs/deploy.md §7);
                                                    # past the cap the kernel kills the app alone and Docker restarts it
    pids_limit: 256
    restart: unless-stopped

  llm:                                            # optional: `docker compose --profile ai up -d`. A llama.cpp
    profiles: [ai]                                #   server the Gantt page's Ask field asks (analysis/query.py);
    image: ghcr.io/ggml-org/llama.cpp:server-b12169   # it receives the file's WBS, code and resource names only
    entrypoint: ["/bin/sh", "-c"]                 # no key, no model: it exits instead of answering anyone
    command:
      - >-
        test -n "$$LLAMA_API_KEY" || { echo "XERSCOPE_LLM_KEY unset: not starting" >&2; exit 1; };
        exec /app/llama-server -m "/models/$${XERSCOPE_LLM_MODEL:-model.gguf}" -c 4096 --parallel 1 --jinja
        --cache-reuse 256
    environment:
      LLAMA_ARG_HOST: 127.0.0.1                     # loopback of this namespace only: `llm-tls` is the only way in
      LLAMA_API_KEY: ${XERSCOPE_LLM_KEY:-}          # the key every request must carry (openssl rand -hex 24)
      XERSCOPE_LLM_MODEL: ${XERSCOPE_LLM_MODEL:-model.gguf}
    user: "${XERSCOPE_UID:-65532}:${XERSCOPE_GID:-65532}"   # the image has no USER: it would run as root
    volumes:
      - ${XERSCOPE_MODELS:-../models}:/models:ro  # one GGUF file (docs/deploy.md §10), readable by XERSCOPE_UID
    networks:                                     # its own network, no gateway, no port: the app reaches it at this
      ai:                                         #   address over TLS (`llm-tls`); it reaches nothing that listens
        ipv4_address: 172.29.0.20
    read_only: true
    ipc: none                                     # no shared memory with anything
    tmpfs:
      - /tmp:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},mode=1777,size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${XERSCOPE_LLM_MEM_LIMIT:-3g}      # a 3B model quantised Q4 with a 4k context (docs/deploy.md §10)
    pids_limit: 64
    restart: unless-stopped

  llm-tls:                                        # TLS for the model (its image has no SSL): the only listener on
    profiles: [ai]                                #   172.29.0.20, https://172.29.0.20:8443 -> 127.0.0.1:8080
    image: caddy:2.11.8                           # stock Caddy: no module needed here
    network_mode: service:llm
    user: "${XERSCOPE_UID:-65532}:${XERSCOPE_GID:-65532}"   # rootless: the certificate is made once on the NAS
    volumes:                                      #   (§10) and read here, nothing is written but tmpfs
      - ./llm.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./llm-certs:/certs:ro                     # llm.crt + llm.key, readable by XERSCOPE_UID only; not in git
    depends_on: [llm]
    read_only: true
    ipc: none
    tmpfs:
      - /tmp:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},size=16m,noexec,nosuid
      - /data:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},size=16m,noexec,nosuid
      - /config:uid=${XERSCOPE_UID:-65532},gid=${XERSCOPE_GID:-65532},size=16m,noexec,nosuid
    cap_drop: [ALL]                               # port 8443 needs none; the binary's file capability does (see caddy)
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

volumes:
  tailscale-state: {}

networks:
  egress: {}                                      # ordinary bridge: tailscaled reaches the control plane
  internal:
    internal: true                                  # no gateway: xerscope cannot reach the internet
    ipam:                                           # a fixed address for the app: Streamlit binds it alone, so the
      config: [{subnet: 172.28.0.0/24}]             # model's network (below) carries nothing that listens
  ai:                                             # the model's network (§10): the model and the app alone, no gateway;
    internal: true                                  # the model is reached by IP, not by a name another container could take
    ipam:
      config: [{subnet: 172.29.0.0/24}]
