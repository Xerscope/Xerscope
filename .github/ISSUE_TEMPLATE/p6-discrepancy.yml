name: Differs from P6 or a standard
description: A check count, a recalculated date or a metric that does not match P6 or the standard's text
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or paste a real schedule: no .xer file, activity name, project code, company name or file path.
        Describe the shape instead (activity type, status, links, constraint, calendar, scheduling option), or rebuild it with `tests/xerkit.py`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - P6 Check Schedule
        - DCMA DECM v8.0
        - DCMA 14-Point
        - Integrity / CPM recalculation
        - Earned value, PPC, milestone trend
        - Changelog
        - XER reading
    validations:
      required: true
  - type: input
    id: metric
    attributes:
      label: Check or field
      placeholder: "P6-12, 06A204b, early finish, total float…"
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Expected and got
      description: Expected value and its source (P6 report, P6 column after F9, standard text with section), then xerscope's value.
      placeholder: |
        P6 Professional 24 Check Schedule: Late activities 12 / 340
        xerscope check --standard P6: 14 / 340
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Shape of the activities involved
      description: Status, type, links and lags, constraints, calendar, scheduling options. Anonymised.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "xerscope commit or image tag; P6 version that produced the export"
    validations:
      required: true
