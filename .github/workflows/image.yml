name: image

# Builds the container image and publishes it to GitHub's registry, so a machine without a
# terminal (a NAS running Container Manager) only pulls it:
#   ghcr.io/xerscope/xerscope:latest            every push to main   (Dockerfile)
#   ghcr.io/xerscope/xerscope:v1.2.3            every tag v*; plus a sha-<short> tag each build
# The owner is lowercased by metadata-action (ghcr.io requires it). A package takes the
# repository's visibility; a public one pulls without a token.
# The image also goes to Docker Hub when wanted (a Container Manager that cannot pull
# from ghcr.io, docs/deploy.md). That leg needs the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (hub.docker.com > Account
# settings > Personal access tokens, Read & Write) and the repository variable
# DOCKERHUB_IMAGE_OWNER (the Docker Hub account the image is named after; a variable, not a
# secret, so the image name is not masked in the logs); skipped when any is absent.
# Nothing is published from a fork: the job runs only in this repository.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'Xerscope/xerscope'
    runs-on: ubuntu-latest
    env:
      # at job level: a step's own `env` is not visible to its `if`
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/xerscope
            name=docker.io/${{ vars.DOCKERHUB_IMAGE_OWNER }}/xerscope,enable=${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_IMAGE_OWNER != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xerscope
          cache-to: type=gha,mode=max,scope=xerscope
