# docker compose up -d   ->  http://localhost:8501
#
# Your weekly XER exports go in ./exports, or the folder XERSCOPE_EXPORTS names (read-only). Optional:
# ./exports/BL.xer as the baseline (uncomment XERSCOPE_BASELINE), ./standards for your
# own TOML standards.
services:
  xerscope:
    build: .
    image: xerscope:latest
    # Published on the host's loopback only: the schedules are not on the network.
    # Exposing it (e.g. "8501:8501") is a deliberate choice; put authentication in front.
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ${XERSCOPE_EXPORTS:-./exports}:/data:ro  # your folder of exports, as XERSCOPE_EXPORTS on the NAS
      # - ./standards:/standards:ro
    environment:
      XERSCOPE_DATA: /data
      # files read at once: auto = as many as the cores and the memory cap allow (docs/deploy.md §12)
      XERSCOPE_LOAD_WORKERS: ${XERSCOPE_LOAD_WORKERS:-auto}
      # XERSCOPE_BASELINE: /data/BL.xer
      # XERSCOPE_STANDARDS: /standards
    read_only: true
    tmpfs:                                          # owned by the image's user (nonroot, 65532): some Docker
      - /tmp:uid=65532,gid=65532,mode=1777          # builds (Synology's) mount a bare tmpfs root-only, and
      - /home/nonroot:uid=65532,gid=65532,mode=700  # Streamlit then fails reading ~/.streamlit/secrets.toml
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${XERSCOPE_MEM_LIMIT:-16g}  # the app's share of the machine; the workers are sized to it
    restart: unless-stopped
