[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"  # the oldest supported: the same count whichever Python runs it
# untyped third-party packages (pandas, plotly, streamlit) read as Any: the count is about our code
ignore_missing_imports = true

[tool.deptry.package_module_name_map]
jpype1 = "jpype"

[tool.deptry.per_rule_ignores]
DEP001 = ["org"]  # Java packages, imported through JPype (verify/)
DEP002 = ["pyarrow"]  # pandas' Parquet engine (export.py), never imported by name

[project.urls]
Repository = "https://github.com/Xerscope/xerscope"
